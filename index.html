<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矿石收集者 Mine Collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#160f0a;
  --bg-panel:#231609;
  --bg-panel2:#2f1d0d;
  --wood-edge:#5a3a1c;
  --wood-edge2:#7a4f26;
  --cream:#f3e6c6;
  --cream-dim:#cbb98d;
  --gold:#ffcf49;
  --gold-dark:#b9860f;
  --accent:#e2793a;
  --danger:#e05a4a;
  --ok:#5ac488;
  --r-common:#b7b0a2;
  --r-uncommon:#4fbd82;
  --r-rare:#4a90e2;
  --r-epic:#b06be0;
  --r-legend:#ffb020;
  --r-base:#8a7a63;
  --pierce:#4a90e2;
  --reflect:#4fbd6f;
}
*{box-sizing:border-box;}
html,body{
  margin:0;height:100%;
  background:radial-gradient(ellipse at center, #241608 0%, #100a05 100%);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--cream);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#app{
  position:relative;width:100vw;height:100vh;
  background:var(--bg-deep);
  overflow:hidden;
}
.screen{
  position:relative;width:100%;height:100%;display:none;flex-direction:column;
}
.screen.active{display:flex;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--wood-edge2);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- HOME ---------- */
#screen-home{
  align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,207,73,.14), transparent 50%),
    radial-gradient(circle at 75% 75%, rgba(226,121,58,.20), transparent 55%),
    linear-gradient(180deg,#1c1108 0%, #0f0904 100%);
  position:relative;
}
#home-bg-img{
  position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:0;
  background-size:cover;background-position:center;
  -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 55%, transparent 92%);
  mask-image:linear-gradient(to bottom, #000 0%, #000 55%, transparent 92%);
}
.home-title{
  font-size:56px;font-weight:900;color:var(--gold);
  letter-spacing:6px;
  text-shadow:
    0 1px 0 rgba(255,255,255,.5),
    0 4px 0 #3a2200,
    0 8px 18px rgba(0,0,0,.5),
    0 0 24px rgba(255,196,84,.35);
  z-index:2;
}
.home-sub{
  font-family:'Orbitron','ZCOOL KuaiLe',sans-serif;
  font-size:21px;font-weight:700;letter-spacing:7px;margin-top:10px;z-index:2;
  position:relative;
  background:linear-gradient(120deg, #ffb92e 0%, #fff8e1 12%, #ffb92e 26%, #e08a1a 42%, #fff8e1 55%, #ffb92e 70%, #fff3c4 85%, #ffb92e 100%);
  background-size:220% auto;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  text-shadow:
    0 1px 0 rgba(255,255,255,.75),
    0 -1px 0 rgba(90,50,0,.55),
    0 3px 6px rgba(0,0,0,.4),
    0 0 18px rgba(255,200,90,.45);
  animation:crystalShine 4.5s linear infinite;
}
@keyframes crystalShine{
  0%{background-position:0% center;}
  100%{background-position:220% center;}
}
.home-btns{
  margin-top:38px;display:flex;flex-direction:column;gap:14px;z-index:2;width:280px;
}
.home-btn{
  padding:14px 0;border-radius:10px;border:2px solid var(--gold-dark);
  background:linear-gradient(180deg,#4a2f14,#2c1a08);
  color:var(--cream);font-size:21px;font-weight:700;letter-spacing:2px;
  box-shadow:0 4px 0 #140c04;transition:transform .1s;
}
.home-btn:hover{background:linear-gradient(180deg,#5c3c1a,#3a2410);}
.home-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #140c04;}
.home-btn.primary{
  background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;border-color:#a06a10;
  box-shadow:0 4px 0 #7a4f0c;
}
.home-btn.primary:hover{background:linear-gradient(180deg,#fff0ab,#ffc94f);}
.home-btn:disabled{opacity:.4;cursor:not-allowed;}
#home-sign{
  position:absolute;bottom:12px;right:18px;color:var(--cream-dim);
  font-size:16px;letter-spacing:1px;opacity:.75;z-index:2;
}
#testmode-toggle{
  position:absolute;bottom:12px;left:18px;color:var(--cream-dim);
  font-size:15px;letter-spacing:.5px;opacity:.55;z-index:2;
  border:1px solid var(--wood-edge2);border-radius:12px;padding:4px 10px;
  background:rgba(0,0,0,.2);
}
#testmode-toggle:hover{opacity:1;}
#testmode-toggle.on{opacity:1;color:var(--ok);border-color:var(--ok);}
#lang-menu{
  position:absolute;z-index:5;background:var(--bg-panel);border:2px solid var(--gold-dark);
  border-radius:10px;padding:8px;display:none;flex-direction:column;gap:4px;
  top:50%;left:50%;transform:translate(-50%,-50%);min-width:220px;
  max-height:80vh;overflow-y:auto;
}
#lang-menu.show{display:flex;}
#lang-menu .lang-opt{
  padding:10px 14px;border-radius:6px;background:transparent;border:none;color:var(--cream);
  text-align:left;font-size:18px;
}
#lang-menu .lang-opt:hover{background:var(--bg-panel2);}
#lang-menu .lang-title{font-size:17px;color:var(--cream-dim);padding:4px 10px;}

/* ---------- MAIN HUB ---------- */
#screen-main{}
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;background:var(--bg-panel);border-bottom:3px solid var(--wood-edge);
  flex-shrink:0;
}
#gold-badge{
  display:flex;align-items:center;gap:8px;
  background:rgba(0,0,0,.3);border:2px solid var(--gold-dark);border-radius:20px;
  padding:6px 16px;font-weight:800;color:var(--gold);font-size:20px;
}
#gold-badge .coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff6cf, var(--gold) 60%, var(--gold-dark));display:inline-block;}
#tabs{display:flex;gap:6px;}
.tab-btn{
  padding:9px 20px;border-radius:8px 8px 0 0;border:2px solid var(--wood-edge2);border-bottom:none;
  background:var(--bg-panel2);color:var(--cream-dim);font-weight:700;font-size:18px;
}
.tab-btn.active{background:var(--bg-deep);color:var(--gold);border-color:var(--gold-dark);}
#topbar-right{display:flex;align-items:center;gap:8px;}
#save-btn,#home-exit-btn{
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;background:none;border:1px solid var(--wood-edge2);
  color:var(--cream-dim);border-radius:8px;
}
#save-btn svg,#home-exit-btn svg{width:19px;height:19px;display:block;}
#save-btn:hover,#home-exit-btn:hover{background:rgba(255,255,255,.06);color:var(--cream);}
#save-btn.saved{color:var(--ok);border-color:var(--ok);}
#tab-content{flex:1;overflow-y:auto;padding:18px 22px;background:var(--bg-deep);max-width:1040px;width:100%;margin:0 auto;box-sizing:border-box;}
.panel-title{font-size:24px;font-weight:800;color:var(--gold);margin:0 0 4px;}
.panel-desc{font-size:17px;color:var(--cream-dim);margin:0 0 16px;}

/* map */
#map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:stretch;}
.terrain-card{
  background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:12px;
  padding:14px 16px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.terrain-card.locked{opacity:.55;filter:grayscale(.4);}
.terrain-card h3{margin:0 0 4px;font-size:21px;color:var(--cream);}
.terrain-thumb{
  width:100%;max-width:220px;aspect-ratio:1/1;margin:4px auto 10px;align-self:center;
  border-radius:10px;overflow:hidden;background:var(--bg-panel2);border:1px solid var(--wood-edge);
}
.terrain-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.terrain-thumb.missing{display:none;}
.terrain-card .tag{font-size:15px;color:var(--gold);background:rgba(255,207,73,.12);border:1px solid var(--gold-dark);border-radius:10px;padding:2px 8px;display:inline-block;margin-bottom:6px;align-self:flex-start;}
.terrain-card .meta{font-size:16.5px;color:var(--cream-dim);line-height:1.7;}
.terrain-card .enter-btn{
  margin-top:auto;width:100%;padding:8px;border-radius:7px;border:2px solid var(--gold-dark);
  background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;font-weight:800;font-size:17px;
}
.terrain-card .enter-btn:disabled{background:#3a3226;color:#8a8065;border-color:#4a4030;}
.terrain-card .lock-note{font-size:16px;color:var(--danger);margin-top:8px;}

/* shop */
#shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px;}
.shop-card{background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;}
.shop-card h3{margin:0 0 6px;font-size:19.5px;color:var(--cream);display:flex;justify-content:space-between;gap:8px;}
.shop-card p{margin:0 0 10px;font-size:16.5px;color:var(--cream-dim);line-height:1.6;flex:1;}
.shop-card .buy-btn{width:100%;padding:8px;border-radius:7px;border:2px solid var(--gold-dark);background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;font-weight:800;font-size:17px;margin-top:auto;}
.shop-card .buy-btn.owned{background:#2c3a2c;color:var(--ok);border-color:#3d5a3d;cursor:default;}
.shop-card .buy-btn:disabled:not(.owned){background:#3a3226;color:#8a8065;border-color:#4a4030;}
.price-tag{color:var(--gold);font-weight:800;white-space:nowrap;}
.shop-section-title{font-size:19px;font-weight:800;color:var(--cream);margin:4px 0 10px;border-left:3px solid var(--gold);padding-left:8px;}
#hookslot-card{background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
#claw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.claw-slot-card{background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:12px;padding:12px 14px;}
.claw-slot-card.disabled{opacity:.4;}
.claw-slot-card h4{margin:0 0 8px;font-size:17.5px;color:var(--cream);}
.claw-upg-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:16px;}
.claw-upg-row button{padding:5px 10px;border-radius:6px;border:1px solid var(--gold-dark);background:rgba(255,207,73,.12);color:var(--gold);font-size:15px;}
.claw-upg-row button.owned{background:#2c3a2c;color:var(--ok);border-color:#3d5a3d;}
.claw-upg-row button:disabled:not(.owned){opacity:.4;}
.dot-pierce{color:var(--pierce);}
.dot-reflect{color:var(--reflect);}

/* warehouse */
#wh-summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;}
#sell-all-unlocked-btn{
  padding:8px 16px;border-radius:8px;border:2px solid var(--gold-dark);
  background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;font-weight:800;font-size:15.5px;
  white-space:nowrap;
}
#sell-all-unlocked-btn:hover{background:linear-gradient(180deg,#fff0ab,#ffc94f);}
#sell-all-unlocked-btn:disabled{background:#3a3226;color:#8a8065;border-color:#4a4030;cursor:not-allowed;}
#wh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.wh-item{background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:10px;padding:10px 8px;text-align:center;position:relative;cursor:grab;}
.wh-item.locked-item{border-color:var(--gold-dark);}
.wh-item.dragging{opacity:.4;cursor:grabbing;}
.wh-item.drag-over{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
.icon-wrap{position:relative;display:block;}
.wh-item .icon{width:57px;height:57px;margin:0 auto 6px;}
.wh-item .name{font-size:16px;color:var(--cream);margin-bottom:2px;}
.wh-item .count{font-size:15px;color:var(--cream-dim);}
.wh-item .btn-row{display:flex;gap:4px;margin-top:6px;}
.wh-item .btn-row button{flex:1;padding:5px 2px;font-size:14px;border-radius:6px;border:1px solid var(--gold-dark);background:rgba(255,207,73,.12);color:var(--gold);}
.wh-item .btn-row button:disabled{opacity:.35;}
.lock-toggle{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:5px;border:1px solid var(--wood-edge2);background:rgba(0,0,0,.35);font-size:15px;color:var(--cream-dim);display:flex;align-items:center;justify-content:center;}
.lock-toggle.locked{background:var(--gold-dark);color:#3a2200;}
#wh-empty{color:var(--cream-dim);font-size:17px;padding:30px;text-align:center;}

#stats-list{
  display:inline-grid;grid-template-columns:auto auto auto;
  align-items:center;column-gap:0;row-gap:8px;
}
.stats-item{display:contents;}
.stats-item .icon{
  width:46px;height:46px;
  background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:10px 0 0 10px;
  border-right:none;padding:8px;box-sizing:content-box;
}
.stats-item .stats-name{
  font-size:16.5px;color:var(--cream);white-space:nowrap;
  background:var(--bg-panel);border-top:2px solid var(--wood-edge2);border-bottom:2px solid var(--wood-edge2);
  padding:8px 10px;align-self:stretch;display:flex;align-items:center;
}
.stats-item .stats-count{
  font-size:17.5px;font-weight:800;color:var(--gold);white-space:nowrap;
  background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:0 10px 10px 0;
  border-left:none;padding:8px 14px;align-self:stretch;display:flex;align-items:center;
}
#stats-empty{color:var(--cream-dim);font-size:17px;padding:30px;text-align:center;}

/* dex */
.dex-section{margin-bottom:24px;position:relative;}
.dex-section:last-of-type{margin-bottom:0;}
.dex-section-title{
  display:flex;align-items:center;gap:8px;margin:0 0 12px;padding-bottom:8px;
  border-bottom:2px solid var(--wood-edge2);
}
.dex-section-title .idx{
  font-size:15px;font-weight:800;color:#3a2200;background:var(--gold);
  border-radius:10px;padding:2px 9px;flex-shrink:0;
}
.dex-section-title .tname{font-size:18.5px;font-weight:800;color:var(--cream);}
.dex-section-title .tcount{font-size:15.5px;color:var(--cream-dim);margin-left:auto;}
.dex-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;position:relative;}
#dex-tooltip{
  display:none;position:fixed;z-index:15;max-width:220px;pointer-events:none;
  background:var(--bg-panel2);border:1px solid var(--gold-dark);border-radius:8px;
  padding:8px 10px;font-size:15.5px;color:var(--cream);box-shadow:0 6px 16px rgba(0,0,0,.5);line-height:1.5;
}
#dex-tooltip b{color:var(--gold);font-size:16.5px;}
.dex-tooltip-formula{color:var(--cream-dim);margin-top:2px;}
.dex-tooltip-note{color:var(--cream-dim);margin-top:4px;font-size:15px;}
.dex-item{background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:10px;padding:8px 6px;text-align:center;position:relative;}
.dex-item.locked{filter:grayscale(1) brightness(.5);}
.dex-item .icon{width:77px;height:77px;margin:0 auto 4px;}
.dex-item .name{font-size:14.5px;color:var(--cream);}
.dex-item .rar{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;}

/* ---------- MINE SCREEN ---------- */
#screen-mine{background:#000;align-items:center;justify-content:center;}
#mine-canvas-wrap{
  position:relative;
  width:min(100%, 1200px, calc(100vh * 900 / 560));
  aspect-ratio:900/560;
  max-height:100%;
  margin:0 auto;
  container-type:inline-size;
}
canvas#mineCanvas{display:block;background:#000;width:100%;height:100%;}
#mine-hud{
  position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:10px 16px;pointer-events:none;font-weight:700;
}
.mine-box{background:rgba(20,12,6,.6);border:2px solid var(--gold-dark);border-radius:8px;padding:6px 14px;font-size:18px;color:var(--cream);text-shadow:0 2px 3px rgba(0,0,0,.6);text-align:center;}
.mine-box .big{font-size:22px;color:var(--gold);}
#mine-terrain-wrap{display:flex;align-items:center;gap:8px;}
#mine-catch-toast{
  background:rgba(20,12,6,.75);border:2px solid var(--gold);border-radius:8px;
  padding:6px 14px;font-size:17px;font-weight:800;color:var(--gold);
  text-shadow:0 2px 3px rgba(0,0,0,.6);white-space:nowrap;
  opacity:0;transform:translateX(-6px);
  transition:opacity .18s ease,transform .18s ease;
  pointer-events:none;
}
#mine-catch-toast.show{opacity:1;transform:translateX(0);}
#mine-hud-right{display:flex;align-items:center;gap:8px;pointer-events:auto;}
#mine-leave-btn{
  padding:9px 14px;border-radius:8px;border:2px solid var(--wood-edge2);
  background:rgba(20,12,6,.7);color:var(--cream);font-size:16.5px;font-weight:700;
  text-shadow:0 2px 3px rgba(0,0,0,.6);
}
#mine-suit{background:rgba(20,12,6,.6);border:2px solid var(--ok);border-radius:8px;padding:6px 12px;font-size:16px;color:var(--ok);text-align:center;}
#mine-timer{
  position:absolute;bottom:2.5cqw;right:2.5cqw;
  width:clamp(42px, 10cqw, 100px);height:clamp(42px, 10cqw, 100px);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:3px solid var(--gold-dark);box-shadow:0 4px 14px rgba(0,0,0,.55);
}
#mine-timer-inner{
  width:80%;height:80%;border-radius:50%;background:#160f0a;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(14px, 3.25cqw, 30px);font-weight:800;color:var(--gold);
  text-shadow:0 2px 3px rgba(0,0,0,.6);
}
#mine-timer.urgent{border-color:var(--danger);}
#mine-timer.urgent #mine-timer-inner{color:var(--danger);}
#mine-hint{position:absolute;bottom:20px;left:0;right:130px;text-align:center;color:#f4e5c0;font-size:16.5px;opacity:.85;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6);}
#mine-result,#mine-faint{
  position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(10,6,3,.88);display:none;align-items:center;justify-content:center;
}
#mine-result.show,#mine-faint.show{display:flex;}
#mine-result-card{background:var(--bg-panel);border:3px solid var(--gold-dark);border-radius:16px;padding:24px 30px;width:460px;max-height:520px;display:flex;flex-direction:column;}
#mine-result-card h2{margin:0 0 4px;color:var(--gold);text-align:center;}
#mine-result-sub{text-align:center;color:var(--cream-dim);font-size:17px;margin-bottom:14px;}
#mine-result-list{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.result-chip{background:var(--bg-panel2);border:1px solid var(--wood-edge2);border-radius:8px;padding:6px;text-align:center;position:relative;}
.result-chip .icon{width:28px;height:28px;margin:0 auto 3px;}
.result-chip .n{font-size:14px;color:var(--cream);}
.result-chip .v{font-size:13.5px;color:var(--gold-dark);}
.result-chip .cnt{position:absolute;top:2px;right:4px;font-size:14px;color:var(--gold);font-weight:800;}
.result-chip .new-badge{
  position:absolute;top:2px;left:4px;font-size:12px;font-weight:900;
  color:#e83b3b;letter-spacing:.5px;
  -webkit-text-stroke:1.5px #fff;paint-order:stroke fill;
}
#mine-result-btn{padding:10px;border-radius:9px;border:2px solid var(--gold-dark);background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;font-weight:800;}
#mine-faint-card{background:var(--bg-panel);border:3px solid var(--danger);border-radius:16px;padding:28px 32px;width:380px;text-align:center;}
#mine-faint-card .skull{font-size:48px;margin-bottom:10px;}
#mine-faint-card h2{margin:0 0 10px;color:var(--danger);}
#mine-faint-card p{color:var(--cream-dim);font-size:17.5px;line-height:1.7;margin:0 0 18px;}
#mine-faint-btn{padding:10px 24px;border-radius:9px;border:2px solid var(--gold-dark);background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;font-weight:800;}

</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div id="home-bg-img"></div>
    <div class="home-title" id="t-title">矿石收集者</div>

// ---------------- ASSET LOADER (art placeholders -> real art via pic/ folder) ----------------
// All art below is optional: if a file is missing, the game silently keeps using the
// procedurally-drawn placeholder that already exists (SVG icons / canvas shapes).
// Drop files with the exact names listed below into the pic/ folder to replace placeholders.
const ASSET = {};
function loadAsset(key, src, onReady){
  const img = new Image();
  img.loaded = false;
  img.onload = () => { img.loaded = true; if(onReady) onReady(img); };
  img.onerror = () => { img.loaded = false; };
  img.src = src;
  ASSET[key] = img;
}
loadAsset('bg_main', 'pic/bg_main.png', () => {
  const el = document.getElementById('home-bg-img');
  if(el) el.style.backgroundImage = "url('pic/bg_main.png')";
});

const SOUND_SRC = {
  buy: 'sound/coin.mp3',
  sell: 'sound/gold.mp3',
  catchWood: 'sound/wood.wav',    // rock/ore/fossil minerals (everything not metal, gem, crystal, or stone-flagged)
  catchStone: 'sound/stone.wav',  // a specific whitelist of plain rock/mineral fillers (see STONE_SOUND_NAMES)
  catchMetal: 'sound/metal.wav',  // literal metal ores (iron, copper, gold, silver, etc.)
  catchGlass: 'sound/glass.mp3',  // 常见宝石矿物 (gem) + 珍稀晶体矿物 (crystal)
  mvp: 'sound/mvp.mp3',           // played once on the results screen if the haul has a new discovery or an epic/legendary
};
function playSound(key){
  const src = SOUND_SRC[key];
  if(!src) return;
  try{
    const a = new Audio(src);
    a.volume = 0.55;
    a.play().catch(()=>{}); // ignore autoplay-blocked errors
  }catch(e){}
}
// Picks the right "caught a mineral" sound based on what was caught.
// Literal metal ores within 工业矿物 — everything else in that category (coal,
// limestone, granite, salt, mica, etc.) is a non-metal rock/mineral and gets
// the same "wood" catch sound as fossils and base ores, not "metal".
const METAL_ORE_NAMES = new Set([
  '铁矿石','铜矿石','铝土矿','锡石','方铅矿','闪锌矿','辉钼矿','镍矿','钨矿',
  '金矿','银矿','铬铁矿','锰矿','褐铁矿','铀矿'
]);
// These plain rock/mineral fillers get their own distinct "stone" knock
// instead of the generic "wood" catch sound. Also rendered at 1.5x size in
// the mining game — see STONE_1_5X_NAMES below (same set, kept separate
// since the two lists don't have to always match if either changes later).
const STONE_SOUND_NAMES = new Set(['煤','石灰石','石膏','褐煤','泥煤','石英砂']);
// Picks the catch sound by what the mineral actually IS, not its rarity:
// gem/crystal minerals ring like glass, metal ores clang like metal, this
// specific whitelist of rock fillers knocks like stone, and everything else
// (other rock, fossil, coal, base ore, etc.) knocks like wood.
function playCatchSound(item){
  const m = item.mineral;
  if(m.category==='常见宝石矿物' || m.category==='珍稀晶体矿物') playSound('catchGlass');
  else if(METAL_ORE_NAMES.has(m.name)) playSound('catchMetal');
  else if(STONE_SOUND_NAMES.has(m.name)) playSound('catchStone');
  else playSound('catchWood');
}

// Returns markup for a mineral icon: shows the real art image (pic/min_xxx.png)
// once it has actually finished loading, otherwise falls back to the
// procedural SVG placeholder. These are no longer stacked on top of each
// other — if they were, any transparent/irregular parts of custom art would
// let the placeholder shape show through underneath it.
function mineralIconHTML(m, size, found){
  const half = size/2;
  if(!found){
    return `<span class="icon icon-wrap"><svg class="icon" viewBox="0 0 ${size} ${size}" style="position:absolute;top:0;right:0;bottom:0;left:0;"><circle cx="${half}" cy="${half}" r="${half-6}" fill="#3a3226"/></svg></span>`;
  }
  const tex = ASSET['min_'+m.icon];
  if(tex && tex.loaded){
    return `<span class="icon icon-wrap"><img src="pic/${m.icon}" class="icon-img" style="position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain;"></span>`;
  }
  const svgInner = mineralSVG(m, half, half);
  return `<span class="icon icon-wrap"><svg class="icon" viewBox="0 0 ${size} ${size}" style="position:absolute;top:0;right:0;bottom:0;left:0;">${svgInner}</svg></span>`;
}

// I18N and TERRAIN_NAME_I18N are defined in lang.js, loaded before this script.
const CAT_KEY = {'工业矿物':'industrial','常见宝石矿物':'gem','珍稀晶体矿物':'crystal','化石':'fossil'};
const RAR_KEY = {'普通':'r_common','少见':'r_uncommon','稀有':'r_rare','史诗':'r_epic','传说':'r_legend'};
// Maps our language codes to the standard <html lang> attribute value.
const HTML_LANG_ATTR = {zh:'zh-CN','zh-TW':'zh-TW',en:'en',de:'de',fr:'fr',ru:'ru',ja:'ja','pt-BR':'pt-BR',es:'es-419',ko:'ko'};

const LANG_STORAGE_KEY = 'omniminer_lang';
const SAVE_STORAGE_KEY = 'omniminer_save';
let lang = localStorage.getItem(LANG_STORAGE_KEY) || 'zh';
if(!I18N[lang]) lang = 'zh';
function t(key){ return I18N[lang][key]; }
// Localized display name for a terrain, falling back to the raw (Chinese) name
// if a translation is missing. The raw name stays the internal id everywhere else.
function trName(tr){
  const entry = TERRAIN_NAME_I18N[tr.name];
  return (entry && entry[lang]) || tr.name;
}
// Localized display name for a mineral, falling back to the raw (Chinese) name
// if a translation is missing. The raw name (m.name) stays the internal id
// everywhere else (MIN_BY_NAME, inventory, discovered, caughtLog, etc).
function minName(m){
  const entry = MINERAL_NAME_I18N[m.name];
  return (entry && entry[lang]) || m.name;
}
// Localized note/备注 text for a mineral, falling back to the raw (Chinese)
// note (or nothing) if no translation exists for the current language.
function minNote(m){
  const entry = MINERAL_NOTE_I18N[m.name];
  return (entry && entry[lang]) || m.note;
}

// ---------------- EQUIPMENT (one-time boolean) ----------------
const EQUIPMENT = [
  {id:'winch', key:'equip_winch', cost:600},
  {id:'light', key:'equip_light', cost:500},
  {id:'luck',  key:'equip_luck',  cost:5000},
  {id:'dive',  key:'equip_dive',  cost:700, unlocks:'海岸'},
  {id:'cold',  key:'equip_cold',  cost:700, unlocks:'冰川'},
  {id:'heat',  key:'equip_heat',  cost:800, unlocks:'火山'},
];
const TERRAIN_GEAR = {'海岸':'dive','冰川':'cold','火山':'heat'};
TERRAINS.forEach(tr => tr.unlocks_req = TERRAIN_GEAR[tr.name] || null);

// ---------------- upgrade cost curves ----------------
function timeUpgradeCost(level){ return Math.round(200*Math.pow(1.4, level)/10)*10; }
function detectorUpgradeCost(level){ return Math.round(220*Math.pow(1.32, level)/10)*10; }
function hookSlotCost(fromCount){ return fromCount===1 ? 2000 : 4500; }
function pierceCost(slot){ return 600 + (slot-1)*400; }
function reflectCost(slot){ return 550 + (slot-1)*350; }
function suitCost(count){ return 350; }

// ---------------- GAME STATE ----------------
// Persistence: the game only auto-saves when a mining run starts (so quitting
// mid-dig and reopening the page can't be used to re-roll a terrain's item
// layout for free) plus whenever the player taps the manual save button.
// Nothing else writes to storage automatically.
function saveGame(){
  if(!game) return;
  try{ localStorage.setItem(SAVE_STORAGE_KEY, JSON.stringify(game)); }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
let game = loadGame();
if(game){
  // Backfill any fields a save might be missing (e.g. it predates a field
  // added later) so the rest of the game never has to null-check for them.
  const defaults = freshGame();
  Object.keys(defaults).forEach(k=>{ if(!(k in game)) game[k] = defaults[k]; });
}
let mine = null;

function freshGame(){
  return {
    gold: 0,
    discovered: {},
    inventory: {},
    caughtTotal: {}, // lifetime catch counts per mineral, never decremented by selling — powers the 数据 tab
    locked: {},
    owned: {},
    timeLevel: 0,
    detectorLevel: 0,
    hookSlots: 1,
    hookUpgrades: {1:{pierce:false,reflect:false},2:{pierce:false,reflect:false},3:{pierce:false,reflect:false}},
    suitCharges: 0,
    testMode: false,
    started: true,
    warehouseOrder: [], // custom drag-to-reorder order for the warehouse grid
  };
}

function discoveredCount(){ return Object.keys(game.discovered).length; }

function terrainUnlocked(terr){
  if(game.testMode) return true;
  if(discoveredCount() < terr.unlockThreshold) return false;
  if(terr.unlocks_req && !game.owned[terr.unlocks_req]) return false;
  return true;
}

// ---------------- SCREENS ----------------
const screens = {
  home: document.getElementById('screen-home'),
  main: document.getElementById('screen-main'),
  mine: document.getElementById('screen-mine'),
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

let testModeEnabled = false;
if(game){
  document.getElementById('btn-continue').disabled = false;
  testModeEnabled = !!game.testMode;
  document.getElementById('testmode-toggle').classList.toggle('on', testModeEnabled);
}

document.getElementById('btn-newgame').addEventListener('click', ()=>{
  game = freshGame();
  if(testModeEnabled){ game.testMode = true; game.gold = Math.max(game.gold, 9999); }
  document.getElementById('btn-continue').disabled = false;
  enterMain();
});
document.getElementById('btn-continue').addEventListener('click', ()=>{
  if(game) enterMain();
});
document.getElementById('btn-lang').addEventListener('click', ()=>{
  document.getElementById('lang-menu').classList.add('show');
});
document.getElementById('lang-menu').addEventListener('click', (e)=>{
  const b = e.target.closest('.lang-opt');
  if(b){ lang = b.dataset.lang; localStorage.setItem(LANG_STORAGE_KEY, lang); applyStaticText(); }
  document.getElementById('lang-menu').classList.remove('show');
});
document.getElementById('home-exit-btn').addEventListener('click', ()=>{
  showScreen('home');
});
let saveFlashTimer = null;
document.getElementById('save-btn').addEventListener('click', ()=>{
  if(!game) return;
  saveGame();
  const btn = document.getElementById('save-btn');
  btn.classList.add('saved');
  clearTimeout(saveFlashTimer);
  saveFlashTimer = setTimeout(()=>{ btn.classList.remove('saved'); }, 900);
});
document.getElementById('testmode-toggle').addEventListener('click', ()=>{
  testModeEnabled = !testModeEnabled;
  if(!game){ game = freshGame(); document.getElementById('btn-continue').disabled=false; }
  game.testMode = testModeEnabled;
  if(testModeEnabled) game.gold = Math.max(game.gold, 9999);
  const el = document.getElementById('testmode-toggle');
  el.classList.toggle('on', testModeEnabled);
  document.getElementById('testmode-state').textContent = testModeEnabled ? t('on_state') : t('off_state');
  if(screens.main.classList.contains('active')) renderTab(currentTab);
});

  document.getElementById('btn-continue').textContent = t('continue_');
  document.getElementById('btn-lang').textContent = t('lang');
  document.getElementById('tab-map').textContent = t('tab_map');
  document.getElementById('tab-shop').textContent = t('tab_shop');
  document.getElementById('tab-warehouse').textContent = t('tab_warehouse');

  document.getElementById('t-haul-title').textContent = t('haul_title');

  document.getElementById('t-faint-title').textContent = t('faint_title');

applyStaticText();

function enterMain(){
  showScreen('main');
  document.getElementById('gold-amount').textContent = game.gold;
  renderTab(currentTab);
}

// ---------------- TABS ----------------
let currentTab = 'map';
let whDragName = null; // name of the warehouse item currently being drag-reordered
// Remembers how far the player had scrolled down in each tab, so switching
// tabs (or just re-rendering the current tab after buying/selling/locking
// something) doesn't snap them back up to the top every time.
const tabScrollPos = {};
document.getElementById('tab-content').addEventListener('scroll', (e)=>{
  tabScrollPos[currentTab] = e.target.scrollTop;
});
document.getElementById('tabs').addEventListener('click', (e)=>{
  const b = e.target.closest('.tab-btn');
  if(!b) return;
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  currentTab = b.dataset.tab;
  renderTab(currentTab);
});

function renderTab(tab){
  document.getElementById('gold-amount').textContent = game.gold;
  const el = document.getElementById('tab-content');
  if(tab==='map') el.innerHTML = renderMap();
  else if(tab==='shop') el.innerHTML = renderShop();
  else if(tab==='warehouse') el.innerHTML = renderWarehouse();
  else if(tab==='dex') el.innerHTML = renderDex();
  else if(tab==='stats') el.innerHTML = renderStats();
  bindTabEvents(tab);
  el.scrollTop = tabScrollPos[tab] || 0;
}

// ---------------- MAP TAB ----------------
function renderMap(){
  let cards = TERRAINS.map(tr=>{
    const unlocked = terrainUnlocked(tr);
    const dCount = discoveredCount();
    let noteHtml = '';
    if(!unlocked){
      if(dCount < tr.unlockThreshold){
        noteHtml += `<div class="lock-note">${t('locked_need').replace('{n}',dCount).replace('{t}',tr.unlockThreshold)}</div>`;
      }
      if(tr.unlocks_req && !game.owned[tr.unlocks_req]){
        const eq = EQUIPMENT.find(e=>e.id===tr.unlocks_req);
        noteHtml += `<div class="lock-note">${t('need_gear')}${I18N[lang][eq.key].n}</div>`;
      }
    }
    const priceLabel = tr.isFree ? t('free') : (tr.ticket+' G');
    const canAfford = tr.isFree || game.gold >= tr.ticket;
    return `<div class="terrain-card ${unlocked?'':'locked'}">
      <span class="tag">#${tr.order}</span>
      <h3>${trName(tr)}</h3>
      <div class="terrain-thumb"><img src="pic/T${tr.order}.png" alt="" loading="lazy" onerror="this.parentElement.classList.add('missing')"></div>
      <div class="meta">${t('enter')}: <b style="color:var(--gold)">${priceLabel}</b></div>
      ${noteHtml}
      <button class="enter-btn" data-terrain="${tr.name}" ${(!unlocked || !canAfford)?'disabled':''}>
        ${unlocked ? (canAfford? t('enter') : t('not_enough_gold')) : '🔒'}
      </button>
    </div>`;
  }).join('');
  return `<div class="panel-title">${t('map_title')}</div><div class="panel-desc">${t('map_desc')}</div><div id="map-grid">${cards}</div>`;
}

function bindTabEvents(tab){
  if(tab==='map'){
    document.querySelectorAll('.enter-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const trName = b.dataset.terrain;
        const tr = TERRAINS.find(x=>x.name===trName);
        if(!tr.isFree){ game.gold -= tr.ticket; playSound('buy'); }
        startMining(tr);
      });
    });
  } else if(tab==='shop'){
    document.querySelectorAll('.buy-btn[data-equip]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = b.dataset.equip;
        const eq = EQUIPMENT.find(x=>x.id===id);
        if(game.owned[id] || game.gold < eq.cost) return;
        game.gold -= eq.cost;
        game.owned[id] = true;
        playSound('buy');
        renderTab('shop');
      });
    });
    const timeBtn = document.getElementById('buy-time-btn');
    if(timeBtn) timeBtn.addEventListener('click', ()=>{
      const cost = timeUpgradeCost(game.timeLevel);
      if(game.gold < cost) return;
      game.gold -= cost; game.timeLevel++; playSound('buy'); renderTab('shop');
    });
    const detBtn = document.getElementById('buy-det-btn');
    if(detBtn) detBtn.addEventListener('click', ()=>{
      const cost = detectorUpgradeCost(game.detectorLevel);
      if(game.gold < cost || BASE_DIG_COUNT+game.detectorLevel >= MAX_DIG_COUNT) return;
      game.gold -= cost; game.detectorLevel++; playSound('buy'); renderTab('shop');
    });
    const suitBtn = document.getElementById('buy-suit-btn');
    if(suitBtn) suitBtn.addEventListener('click', ()=>{
      const cost = suitCost();
      if(game.gold < cost) return;
      game.gold -= cost; game.suitCharges += 10; playSound('buy'); renderTab('shop');
    });
    const slotBtn = document.getElementById('buy-slot-btn');
    if(slotBtn) slotBtn.addEventListener('click', ()=>{
      if(game.hookSlots>=3) return;
      const cost = hookSlotCost(game.hookSlots);
      if(game.gold < cost) return;
      game.gold -= cost; game.hookSlots++; playSound('buy'); renderTab('shop');
    });
    document.querySelectorAll('.buy-pierce').forEach(b=>{
      b.addEventListener('click', ()=>{
        const slot = +b.dataset.slot;
        if(game.hookUpgrades[slot].pierce) return;
        const cost = pierceCost(slot);
        if(game.gold < cost) return;
        game.gold -= cost; game.hookUpgrades[slot].pierce = true; playSound('buy'); renderTab('shop');
      });
    });
    document.querySelectorAll('.buy-reflect').forEach(b=>{
      b.addEventListener('click', ()=>{
        const slot = +b.dataset.slot;
        if(game.hookUpgrades[slot].reflect) return;
        const cost = reflectCost(slot);
        if(game.gold < cost) return;
        game.gold -= cost; game.hookUpgrades[slot].reflect = true; playSound('buy'); renderTab('shop');
      });
    });
  } else if(tab==='warehouse'){
    document.querySelectorAll('.sell-one').forEach(b=>{
      b.addEventListener('click', ()=>{ sellOne(b.dataset.name); renderTab('warehouse'); });
    });
    document.querySelectorAll('.sell-stack').forEach(b=>{
      b.addEventListener('click', ()=>{
        const name = b.dataset.name;
        if(game.locked[name]) return;
        const c = game.inventory[name]||0;
        if(c>0){
          game.gold += MIN_BY_NAME[name].price * c;
          delete game.inventory[name];
          playSound('sell');
        }
        renderTab('warehouse');
      });
    });
    const sellAllBtn = document.getElementById('sell-all-unlocked-btn');
    if(sellAllBtn){
      sellAllBtn.addEventListener('click', ()=>{
        sellAllUnlocked();
        renderTab('warehouse');
      });
    }
    document.querySelectorAll('.lock-toggle').forEach(b=>{
      b.addEventListener('click', ()=>{
        const name = b.dataset.name;
        game.locked[name] = !game.locked[name];
        renderTab('warehouse');
      });
    });
    document.querySelectorAll('.wh-item').forEach(el=>{
      el.addEventListener('dragstart', (e)=>{
        whDragName = el.dataset.name;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', whDragName); // required by some browsers to allow the drag
      });
      el.addEventListener('dragend', ()=>{
        el.classList.remove('dragging');
        document.querySelectorAll('.wh-item.drag-over').forEach(x=>x.classList.remove('drag-over'));
        whDragName = null;
      });
      el.addEventListener('dragover', (e)=>{
        e.preventDefault(); // must preventDefault on dragover for drop to fire
        e.dataTransfer.dropEffect = 'move';
        if(el.dataset.name !== whDragName) el.classList.add('drag-over');
      });
      el.addEventListener('dragleave', ()=>{ el.classList.remove('drag-over'); });
      el.addEventListener('drop', (e)=>{
        e.preventDefault();
        el.classList.remove('drag-over');
        const targetName = el.dataset.name;
        if(!whDragName || whDragName===targetName) return;
        const order = game.warehouseOrder;
        const from = order.indexOf(whDragName);
        const to = order.indexOf(targetName);
        if(from===-1 || to===-1) return;
        order.splice(from,1);
        order.splice(to,0,whDragName);
        whDragName = null;
        renderTab('warehouse');
      });
    });
  } else if(tab==='dex'){
    document.querySelectorAll('.dex-item').forEach(b=>{
      b.addEventListener('mouseenter', (e)=> showDexTooltip(e, b.dataset.name));
      b.addEventListener('mousemove', (e)=> positionDexTooltip(e));
      b.addEventListener('mouseleave', hideDexTooltip);
    });
  }
}

function sellOne(name){
  if(game.locked[name]) return;
  if(!game.inventory[name] || game.inventory[name]<=0) return;
  game.inventory[name]--;
  if(game.inventory[name]<=0) delete game.inventory[name];
  game.gold += MIN_BY_NAME[name].price;
  playSound('sell');
}
// Sells every full stack in the warehouse that isn't locked, in one go.
// Updates inventory/gold directly (rather than looping sellOne per unit) so
// a big bulk sell doesn't fire dozens of overlapping "sell" sounds at once —
// one sound plays for the whole action instead.
function sellAllUnlocked(){
  let sold = false;
  Object.keys(game.inventory).forEach(name=>{
    if(game.locked[name]) return;
    const c = game.inventory[name]||0;
    if(c<=0) return;
    game.gold += MIN_BY_NAME[name].price * c;
    delete game.inventory[name];
    sold = true;
  });
  if(sold) playSound('sell');
}

// ---------------- SHOP TAB ----------------
function renderShop(){
  const cards = EQUIPMENT.map(eq=>{
    const owned = !!game.owned[eq.id];
    const label = I18N[lang][eq.key];
    return `<div class="shop-card">
      <h3>${label.n} <span class="price-tag">${eq.cost} G</span></h3>
      <p>${label.d}</p>
      <button class="buy-btn ${owned?'owned':''}" data-equip="${eq.id}" ${(owned || game.gold<eq.cost)?'disabled':''}>
        ${owned ? t('owned') : t('buy')}
      </button>
    </div>`;
  }).join('');

  const nextTimeCost = timeUpgradeCost(game.timeLevel);
  const curTime = BASE_DIG_TIME + game.timeLevel*5;
  const timeCard = `<div class="shop-card">
      <h3>${t('shop_time_n')} <span class="price-tag">${nextTimeCost} G</span></h3>
      <p>${t('shop_time_d')}<br>${t('time_cur')}: <b style="color:var(--gold)">${curTime}s</b></p>
      <button class="buy-btn" id="buy-time-btn" ${game.gold<nextTimeCost?'disabled':''}>${t('buy_short')}</button>
    </div>`;

  const curDig = BASE_DIG_COUNT + game.detectorLevel;
  const detMaxed = curDig >= MAX_DIG_COUNT;
  const nextDetCost = detectorUpgradeCost(game.detectorLevel);
  const detCard = `<div class="shop-card">
      <h3>${t('shop_det_n')} <span class="price-tag">${detMaxed? '' : nextDetCost+' G'}</span></h3>
      <p>${t('shop_det_d')}<br>${t('det_cur')}: <b style="color:var(--gold)">${curDig}</b></p>
      <button class="buy-btn ${detMaxed?'owned':''}" id="buy-det-btn" ${(detMaxed || game.gold<nextDetCost)?'disabled':''}>${detMaxed? t('max_lv') : t('buy_short')}</button>
    </div>`;

  const suitCostVal = suitCost();
  const suitCard = `<div class="shop-card">
      <h3>${t('shop_suit_n')} <span class="price-tag">${suitCostVal} G</span></h3>
      <p>${t('shop_suit_d')}<br>${t('suit_cur')}: <b style="color:var(--gold)">${game.suitCharges}</b></p>
      <button class="buy-btn" id="buy-suit-btn" ${game.gold<suitCostVal?'disabled':''}>${t('buy_short')}</button>
    </div>`;

  const slotMaxed = game.hookSlots>=3;
  const nextSlotCost = hookSlotCost(game.hookSlots);
  const hookSlotBlock = `<div id="hookslot-card">
    <div class="shop-section-title">${t('hookslot_title')}</div>
    <p style="margin:0 0 10px;font-size:16.5px;color:var(--cream-dim);">${t('hookslot_desc')}<br>${t('hookslot_cur')}: <b style="color:var(--gold)">${game.hookSlots}/3</b></p>
    <button class="buy-btn ${slotMaxed?'owned':''}" id="buy-slot-btn" style="width:auto;padding:8px 20px;" ${(slotMaxed || game.gold<nextSlotCost)?'disabled':''}>
      ${slotMaxed? t('max_lv') : t('hookslot_buy')+' ('+nextSlotCost+' G)'}
    </button>
  </div>`;

  const clawCards = [1,2,3].map(slot=>{
    const unlocked = slot <= game.hookSlots;
    const up = game.hookUpgrades[slot];
    const pCost = pierceCost(slot), rCost = reflectCost(slot);
    return `<div class="claw-slot-card ${unlocked?'':'disabled'}">
      <h4>${t('claw_n').replace('{n}',slot)} ${unlocked?'':'· '+t('claw_locked')}</h4>
      <div class="claw-upg-row">
        <span class="dot-pierce">● ${t('pierce_n')}</span>
        <button class="buy-pierce ${up.pierce?'owned':''}" data-slot="${slot}" ${(!unlocked||up.pierce||game.gold<pCost)?'disabled':''}>
          ${up.pierce? t('owned') : pCost+'G'}
        </button>
      </div>
      <div class="claw-upg-row">
        <span class="dot-reflect">● ${t('reflect_n')}</span>
        <button class="buy-reflect ${up.reflect?'owned':''}" data-slot="${slot}" ${(!unlocked||up.reflect||game.gold<rCost)?'disabled':''}>
          ${up.reflect? t('owned') : rCost+'G'}
        </button>
      </div>
    </div>`;
  }).join('');

  return `<div class="panel-title">${t('shop_title')}</div><div class="panel-desc">${t('shop_desc')}</div>
    <div id="shop-grid">${timeCard}${detCard}${suitCard}${cards}</div>
    ${hookSlotBlock}
    <div class="shop-section-title">${t('claw_title')}</div>
    <div id="claw-grid">${clawCards}</div>`;
}

// ---------------- WAREHOUSE TAB ----------------
function warehouseOrderedNames(){
  const inInventory = new Set(Object.keys(game.inventory));
  // Keep the saved order, dropping any names no longer in the inventory...
  const ordered = game.warehouseOrder.filter(n=> inInventory.has(n));
  const orderedSet = new Set(ordered);
  // ...then append any inventory items not yet tracked in the order (newly
  // picked-up minerals), so nothing goes missing from the grid.
  Object.keys(game.inventory).forEach(n=>{ if(!orderedSet.has(n)) ordered.push(n); });
  game.warehouseOrder = ordered; // self-heal so it stays in sync going forward
  return ordered;
}
function renderWarehouse(){
  const names = warehouseOrderedNames();
  if(names.length===0){
    return `<div class="panel-title">${t('wh_title')}</div><div class="panel-desc">${t('wh_desc')}</div><div id="wh-empty">${t('wh_empty')}</div>`;
  }
  let totalVal = 0;
  const items = names.map(name=>{
    const m = MIN_BY_NAME[name];
    const c = game.inventory[name];
    const locked = !!game.locked[name];
    totalVal += m.price*c;
    return `<div class="wh-item ${locked?'locked-item':''}" draggable="true" data-name="${name}">
      <button class="lock-toggle ${locked?'locked':''}" data-name="${name}">${locked?'🔒':'🔓'}</button>
      ${mineralIconHTML(m,40,true)}
      <div class="name">${minName(m)}</div>

// ---------------- MINERAL SVG (procedural icon by category+rarity) ----------------
function mineralSVG(m, cx, cy){
  const color = mineralColor(m);
  const dark = shadeColor(color, -30);
  const r = 13;
  if(m.category==='工业矿物'){
    return polySVG(cx,cy,r,6,color,dark,0.15);
  } else if(m.category==='常见宝石矿物'){
    return diamondSVG(cx,cy,r,color,dark);
  } else if(m.category==='珍稀晶体矿物'){
    return starSVG(cx,cy,r,color,dark);
  } else {
    return blobSVG(cx,cy,r,color,dark);
  }
}
function shadeColor(hex, percent){
  hex = hex.replace('#','');
  let num = parseInt(hex,16);
  let r = (num>>16), g=(num>>8 & 0xff), b=(num & 0xff);
  r = Math.max(0,Math.min(255, r + percent));
  g = Math.max(0,Math.min(255, g + percent));
  b = Math.max(0,Math.min(255, b + percent));
  return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function polySVG(cx,cy,r,n,fill,edge,jag){
  let pts=[];
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2;
    const rr = r*(0.85+jag*Math.sin(i*2.3));
    pts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));
  }
  return `<polygon points="${pts.join(' ')}" fill="${fill}" stroke="${edge}" stroke-width="1.5"/>`;
}
function diamondSVG(cx,cy,r,fill,edge){
  return `<polygon points="${cx},${cy-r} ${cx+r*0.8},${cy} ${cx},${cy+r} ${cx-r*0.8},${cy}" fill="${fill}" stroke="${edge}" stroke-width="1.5"/>
  <polygon points="${cx},${cy-r*0.55} ${cx+r*0.3},${cy} ${cx},${cy} " fill="rgba(255,255,255,.55)"/>`;
}
function starSVG(cx,cy,r,fill,edge){
  let pts=[];
  const n=6;
  for(let i=0;i<n*2;i++){
    const a = (i/(n*2))*Math.PI*2;
    const rr = i%2===0? r : r*0.42;
    pts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));
  }
  return `<polygon points="${pts.join(' ')}" fill="${fill}" stroke="${edge}" stroke-width="1.2"/>`;
}
function blobSVG(cx,cy,r,fill,edge){
  return `<ellipse cx="${cx}" cy="${cy+2}" rx="${r*0.95}" ry="${r*0.72}" fill="${fill}" stroke="${edge}" stroke-width="1.5"/>
  <circle cx="${cx-r*0.3}" cy="${cy-r*0.2}" r="${r*0.18}" fill="${edge}"/>`;
}

function buildPool(terrain){
  // Deeper (higher-order) terrains skew toward better epic/legendary base odds
  // before the luck item even enters the picture, so expected value climbs with
  // progression instead of every mid-tier terrain landing at roughly the same
  // payout. Only the two rarest tiers are boosted — touching common/rare odds
  // too would swing the "commons" pool wildly for terrains that already carry
  // a lot of specials (e.g. the deep cave).
  const terrainLuck = 1 + (terrain.order-1)*0.20;
  const override = TERRAIN_PROB_OVERRIDE[terrain.name];
  let raw = [];
  if(override){
    const splitWeights = override.splitWeights || {};
    let autoSum = 0;
    const autoList = [];
    terrain.minerals.map(n=>MIN_BY_NAME[n]).forEach(m=>{
      if(override.fixed[m.name]!==undefined || splitWeights[m.name]!==undefined) return;
      let p = FIXED_PROB[m.rarity] || 0;
      if(m.rarity==='传说' || m.rarity==='史诗') p *= terrainLuck;
      autoList.push({name:m.name, mineral:m, w:p});
      autoSum += p;
    });
    const fixedSum = Object.values(override.fixed).reduce((s,v)=>s+v,0);
    const luckAffected = new Set(override.luckAffected || []);
    Object.keys(override.fixed).forEach(name=>{
      // `locked` entries are hand-picked exact values (see the per-terrain
      // comments above) — they never move on their own, including when the
      // luck item is bought, same as they've never responded to terrainLuck
      // either. `luckAffected` is a narrow escape hatch: a locked item can
      // still be whitelisted to respond specifically to the luck item's
      // epic/legendary doubling (see 山地's 祖母绿) without giving up its
      // frozen base value or reacting to anything else.
      raw.push({name, mineral:MIN_BY_NAME[name], w:override.fixed[name], isBase:(name===terrain.baseOre), locked:!luckAffected.has(name)});
    });
    const weightSum = Object.values(splitWeights).reduce((s,v)=>s+v,0);
    if(weightSum>0){
      // A splitWeights group is present: it absorbs the true leftover (after
      // fixed AND the auto items' own raw formula weight), and the auto items
      // keep that raw (unscaled) weight — same as the original per-terrain
      // baseProb formula treats "specials" vs "commons".
      const leftover = Math.max(0, 1 - fixedSum - autoSum);
      Object.keys(splitWeights).forEach(name=>{
        const share = splitWeights[name]/weightSum;
        raw.push({name, mineral:MIN_BY_NAME[name], w: leftover*share, isBase:(name===terrain.baseOre)});
      });
      autoList.forEach(x=> raw.push({name:x.name, mineral:x.mineral, w:x.w, isBase:false}));
    } else {
      // No splitWeights group: nothing else is around to soak up whatever the
      // fixed entries didn't claim, so the auto (rarity-formula) items scale
      // up together to fill exactly that remaining fraction — same relative
      // proportions to each other, just resized to fit the leftover budget
      // instead of landing wherever their raw FIXED_PROB weights happen to sum to.
      const availableForAuto = Math.max(0, 1 - fixedSum);
      const scale = autoSum>0 ? availableForAuto/autoSum : 0;
      autoList.forEach(x=> raw.push({name:x.name, mineral:x.mineral, w:x.w*scale, isBase:false}));
    }
  } else {
    // Each terrain carries its own base-ore weight (baseProb) so per-terrain profit
    // margin can be tuned independently: raise it to dilute the pool with cheap
    // base ore (lowers expected value / margin), lower it to let the pricier
    // specials/commons dominate (raises expected value / margin). This is a raw
    // weight, not a capped 0-1 probability — it only matters relative to the other
    // raw weights below, so values above 1 are valid and just mean "base ore
    // dominates the pool even more".
    const baseProb = terrain.baseProb!==undefined ? terrain.baseProb : BASE_PROB;
    const extraDefs = terrain.minerals.map(n=>MIN_BY_NAME[n]);
    raw.push({name:terrain.baseOre, mineral:MIN_BY_NAME[terrain.baseOre], w: baseProb, isBase:true});
    const commons = extraDefs.filter(m=>m.rarity==='普通');
    const specials = extraDefs.filter(m=>m.rarity!=='普通');
    let specialSum = 0;
    specials.forEach(m=>{
      let p = FIXED_PROB[m.rarity];
      if(m.rarity==='传说' || m.rarity==='史诗') p *= terrainLuck;
      raw.push({name:m.name, mineral:m, w:p, isBase:false});
      specialSum += p;
    });
    const remaining = Math.max(0.0001, 1 - baseProb - specialSum);
    const perCommon = commons.length ? remaining/commons.length : 0;
    commons.forEach(m=> raw.push({name:m.name, mineral:m, w:perCommon, isBase:false}));
  }
  const total = raw.reduce((s,x)=>s+x.w,0);
  raw.forEach(x=>x.w = x.w/total);
  // Luck item: doubles epic/legendary odds outright, and pays for that exactly
  // by deducting the same total amount evenly from this terrain's common-tier
  // odds — nothing gets diffused proportionally across every rarity tier the
  // way a flat renormalization would.
  // `locked` (hand-picked fixed) epic/legendary values are excluded from
  // doubling — e.g. mountain's four were explicitly frozen and shouldn't move
  // for any reason, luck item included. But that exception is specifically
  // about protecting those named rare items; it does NOT extend to common-tier
  // minerals that happen to have a hand-picked value (e.g. desert's 石膏/岩盐/
  // 磷灰石/玛瑙/虎眼石/石英砂) — those still share in the deduction like any
  // other 普通 item, since nothing asked for them to be protected from it.
  if(game.owned['luck']){
    let delta = 0;
    raw.forEach(x=>{
      if(!x.locked && (x.mineral.rarity==='传说' || x.mineral.rarity==='史诗')){
        delta += x.w;
        x.w *= 2;
      }
    });
    // Normally 普通-tier items absorb the cost; cascade up through 少见/稀有
    // only in the (now rarer) case a terrain has literally zero 普通 items at
    // all, so the total still lands on 100% instead of overshooting it.
    let commons = [];
    for(const tier of ['普通','少见','稀有']){
      commons = raw.filter(x=>x.mineral.rarity===tier);
      if(commons.length) break;
    }
    if(commons.length && delta>0){
      const perCommon = delta/commons.length;
      commons.forEach(x=>{ x.w = Math.max(0, x.w - perCommon); });
    }
  }
  return raw;
}
function weightedPick(pool){
  let r = Math.random();
  for(const p of pool){ r -= p.w; if(r<=0) return p; }
  return pool[pool.length-1];
}
function rand(a,b){ return a+Math.random()*(b-a); }

const CLAW_OFFSETS = { 1:[0], 2:[-0.4,0.4], 3:[-0.55,0,0.55] };

function startMining(terrain){
  const pool = buildPool(terrain);
  const digCount = BASE_DIG_COUNT + game.detectorLevel;
  const spots = [];
  let tries=0;
  while(spots.length<digCount && tries<2000){
    tries++;
    const rr = rand(16,30);
    const x = rand(50,W-50);
    const y = rand(GROUND_Y+55,H-40);
    let ok=true;
    for(const s of spots){
      const dx=s.x-x, dy=s.y-y;
      if(Math.sqrt(dx*dx+dy*dy) < rr+s.r+16){ ok=false; break; }
    }
    if(ok) spots.push({x,y,r:rr});
  }
  // Base-ore items are normally drawn bigger (r:30) than their rarity would
  // dictate, but 花岗岩 should stay the same size as any other mineral of its
  // rarity — everything else about being the base ore (physics weight, catch
  // sound, shape/color fallback) is untouched.
  const NORMAL_SIZE_BASE_ORES = new Set(['花岗岩']);
  // These render at 1.5x their normal rarity size (and never use the enlarged
  // base-ore size even if they happen to be a terrain's base ore) — same
  // whitelist as STONE_SOUND_NAMES above, kept as a separate constant since
  // there's no reason the two lists must always match if either changes later.
  const STONE_1_5X_NAMES = new Set(['煤','石灰石','石膏','褐煤','泥煤','石英砂']);
  const items = spots.map(s=>{
    const pick = weightedPick(pool);
    const m = pick.mineral;
    const useBaseSize = pick.isBase && !NORMAL_SIZE_BASE_ORES.has(m.name) && !STONE_1_5X_NAMES.has(m.name);
    let r = useBaseSize ? 30 : RARITY_R[m.rarity];
    if(STONE_1_5X_NAMES.has(m.name)) r *= 1.5;
    return {
      name:m.name, mineral:m, isBase:pick.isBase,
      x:s.x, y:s.y, r,
      weight: pick.isBase?2.8:RARITY_WEIGHT[m.rarity],
      alive:true, carried:false,
      hazardType: HAZARD.includes(m.name),
    };
  });

  const winchMult = game.owned['winch'] ? 1.25 : 1.0;
  const lightMult = game.owned['light'] ? 0.8 : 1.0;
  const timeTotal = BASE_DIG_TIME + game.timeLevel*5;

  const offsets = CLAW_OFFSETS[game.hookSlots];
  const hooks = [];
  for(let s=1; s<=game.hookSlots; s++){
    const up = game.hookUpgrades[s];
    hooks.push({
      slot:s, offset: offsets[s-1],
      angle:0, phase:0, length:40, state:'swing',
      attachedGroup:[], pendingGroup:[], bounced:false, clawOpen:1,
      bendPoint:null, bendDir:null, bendLen:0,
      pierce: !!up.pierce, reflect: !!up.reflect,
    });
  }

  mine = {
    terrain, items, digCount, remaining: digCount,
    hooks,
    extendSpeed: 480*0.7*winchMult,   // 钩爪下探默认速度 = 原速度(480)的70%
    retractSpeed: 480*0.6*winchMult,  // 矿石拉回默认速度 = 原速度(480)的60%
    weightMult: lightMult,
    swingSpeed: 1.25,
    timeLeft: timeTotal, timeTotal: timeTotal, ending:false,
    sessionValue: 0, caughtLog: {}, // name -> {mineral,count}
  };
  document.getElementById('mine-terrain-name').textContent = trName(terrain);
  saveGame();
  const catchToastEl = document.getElementById('mine-catch-toast');
  if(catchToastEl){ catchToastEl.classList.remove('show'); catchToastEl.textContent=''; }
  clearTimeout(catchToastTimer);
  document.getElementById('mine-gold').textContent = 0;
  document.getElementById('mine-remain').textContent = mine.remaining+'/'+mine.digCount;
  document.getElementById('mine-result').classList.remove('show');
  document.getElementById('mine-faint').classList.remove('show');
  updateTimerUI();
  showScreen('mine');
}

function updateTimerUI(){
  if(!mine) return;
  const el = document.getElementById('mine-timer');
  const num = document.getElementById('mine-timer-num');
  const frac = Math.max(0, mine.timeLeft/mine.timeTotal);
  const deg = frac*360;
  el.style.background = `conic-gradient(var(--gold) ${deg}deg, rgba(255,255,255,0.14) ${deg}deg)`;
  const secs = Math.max(0, Math.ceil(mine.timeLeft));
  num.textContent = secs;
  el.classList.toggle('urgent', secs<=10);
}

function tipFor(hook){
  if(hook.bendPoint){
    return { x: hook.bendPoint.x + hook.bendDir.x*hook.bendLen, y: hook.bendPoint.y + hook.bendDir.y*hook.bendLen };
  }
  return { x: HOOK_PIVOT.x + Math.sin(hook.angle)*hook.length, y: HOOK_PIVOT.y + Math.cos(hook.angle)*hook.length };
}
function hookDir(hook){
  return hook.bendDir ? hook.bendDir : { x: Math.sin(hook.angle), y: Math.cos(hook.angle) };
}
// True reflect: mirror the travel direction off whichever wall (left/right/bottom) the
// tip just crossed, and keep extending from that contact point — a real bounce, not a
// reset-and-relaunch-from-the-pivot. Only used once per throw (hook.bounced flag).
function tryBounce(hook, tip){
  hook.bounced = true;
  const dir = hookDir(hook);
  let cx = tip.x, cy = tip.y, ndx = dir.x, ndy = dir.y;
  if(tip.x < 0){ cx = 0; ndx = -dir.x; }
  else if(tip.x > W){ cx = W; ndx = -dir.x; }
  if(tip.y > H){ cy = H; ndy = -dir.y; }
  hook.bendPoint = {x:cx, y:cy};
  hook.bendDir = {x:ndx, y:ndy};
  hook.bendLen = 0;
}
function fireHook(){
  if(!mine) return;
  // Recompute the swing angle right now (rather than reusing last frame's
  // value) so the hook launches exactly where the player saw it, with no
  // extra lag from waiting on the next animation frame.
  const now = performance.now();
  const extraDt = lastTime ? Math.min(0.05, Math.max(0,(now-lastTime)/1000)) : 0;
  for(const hook of mine.hooks){
    if(hook.state==='swing'){
      let a = Math.sin(hook.phase + mine.swingSpeed*extraDt) * SWING_LIMIT + hook.offset;
      if(a>SWING_LIMIT) a=SWING_LIMIT; if(a<-SWING_LIMIT) a=-SWING_LIMIT;
      hook.angle = a;
      hook.state='extend'; hook.length=40; hook.attachedGroup=[]; hook.pendingGroup=[]; hook.bounced=false;
      hook.bendPoint=null; hook.bendDir=null; hook.bendLen=0;
    }
  }
}
window.addEventListener('keydown', e=>{
  if(e.code==='Space' && screens.mine.classList.contains('active')){ e.preventDefault(); fireHook(); }
});
canvas.addEventListener('click', fireHook);
document.getElementById('mine-leave-btn').addEventListener('click', ()=>{
  if(!mine || mine.ending) return;
  mine.ending = true;
  finishMining();
});
document.getElementById('mine-result-btn').addEventListener('click', ()=>{
  document.getElementById('mine-result').classList.remove('show');
  enterMain();
});
document.getElementById('mine-faint-btn').addEventListener('click', ()=>{
  document.getElementById('mine-faint').classList.remove('show');
  mine = null;
  enterMain();
  currentTab='shop';
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-shop').classList.add('active');
  renderTab('shop');
});

function grabItem(item){
  item.alive = false;
  item.carried = true;
  mine.remaining--;
  document.getElementById('mine-remain').textContent = mine.remaining+'/'+mine.digCount;
}

let popups = [];
let lastTime = 0;

function commitItem(item){
  if(item.hazardType){
    if(game.suitCharges>0){ game.suitCharges--; }
    else { return 'fainted'; }
  }
  const isFirstEver = !game.discovered[item.name];
  game.discovered[item.name] = true;
  game.inventory[item.name] = (game.inventory[item.name]||0)+1;
  game.caughtTotal[item.name] = (game.caughtTotal[item.name]||0)+1;
  mine.sessionValue += item.mineral.price;
  if(!mine.caughtLog[item.name]) mine.caughtLog[item.name] = {mineral:item.mineral, count:0, isNew:false};
  mine.caughtLog[item.name].count++;
  if(isFirstEver) mine.caughtLog[item.name].isNew = true;
  popups.push({x:ANCHOR.x,y:ANCHOR.y+10,life:1.2,
    text: '+'+item.mineral.price+'G',
    color: RARITY_COLOR_HEX[item.mineral.rarity]});
  showCatchToast(item.mineral);
  return 'ok';
}

let catchToastTimer = null;
function showCatchToast(mineral){
  const el = document.getElementById('mine-catch-toast');
  if(!el) return;
  el.textContent = t('gained')+minName(mineral);
  el.classList.add('show');
  clearTimeout(catchToastTimer);
  catchToastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 1600);
}

function updateMine(dt){
  if(mine.ending) return;
  mine.timeLeft -= dt;
  updateTimerUI();
  if(mine.timeLeft<=0){
    mine.timeLeft=0; mine.ending=true;
    setTimeout(()=>finishMining(), 120);
    return;
  }

  let fainted = false;

  for(const hook of mine.hooks){
    if(fainted) break;
    const clawTarget = (hook.state==='retract' && hook.attachedGroup && hook.attachedGroup.length>0) ? 0 : 1;
    hook.clawOpen = (hook.clawOpen===undefined?1:hook.clawOpen) + (clawTarget-(hook.clawOpen===undefined?1:hook.clawOpen))*Math.min(1, dt*9);
    if(hook.state==='swing'){
      hook.phase += mine.swingSpeed*dt;
      let a = Math.sin(hook.phase) * SWING_LIMIT + hook.offset;
      if(a>SWING_LIMIT) a=SWING_LIMIT; if(a<-SWING_LIMIT) a=-SWING_LIMIT;
      hook.angle = a;
    } else if(hook.state==='extend'){
      if(hook.bendPoint){ hook.bendLen += mine.extendSpeed*dt; }
      else { hook.length += mine.extendSpeed*dt; }
      const tip = tipFor(hook);
      const curLen = hook.bendPoint ? hook.bendLen : hook.length;
      // Once the hook has bounced and is now travelling back upward, it should
      // only go as far as the top of the area minerals can actually spawn in
      // (GROUND_Y+55, matching the spot-generation range below) rather than
      // sailing all the way up to the top edge of the whole canvas.
      const dir = hookDir(hook);
      const topBound = (hook.bounced && dir.y<0) ? (GROUND_Y+55) : -20;
      const offscreen = tip.x<-20 || tip.x>W+20 || tip.y>H+20 || tip.y<topBound;
      // The bounce itself needs a *tight* boundary check (no buffer): tryBounce()
      // clamps the new bend point exactly onto the wall (x=0/W or y=H), so if we
      // wait until the tip has already drifted the same ~20px past the wall that
      // `offscreen` allows, the bend point snaps backward by that much the instant
      // it's created — a visible jump in the line. Triggering right on contact
      // keeps the bend point within about one frame's travel of where the tip
      // already is, so there's no snap.
      const hitWall = tip.x<=0 || tip.x>=W || tip.y>=H;
      if(!hook.pierce){
        let hit=null;
        for(const it of mine.items){
          if(!it.alive) continue;
          const dx=it.x-tip.x, dy=it.y-tip.y;
          if(Math.sqrt(dx*dx+dy*dy) < it.r+8){ hit=it; break; }
        }
        if(hit){ grabItem(hit); hook.attachedGroup=[hit]; hook.state='retract'; }
        else if(hook.reflect && !hook.bounced && (hitWall || curLen>MAX_LEN)){ tryBounce(hook, tip); }
        else if(curLen>MAX_LEN || offscreen){ hook.state='retract'; }
      } else {
        // Pierce: mark items as pierced on contact but don't collect them yet — they
        // stay put and get picked up one by one on the way back during retract, so the
        // mineral art stacks onto the claw progressively instead of all at once.
        for(const it of mine.items){
          if(!it.alive || it.pierced) continue;
          const dx=it.x-tip.x, dy=it.y-tip.y;
          if(Math.sqrt(dx*dx+dy*dy) < it.r+8){
            it.pierced = true;
            it._pierceLeg = hook.bendPoint ? 'bend' : 'main';
            it._pierceDist = curLen;
            hook.pendingGroup.push(it);
          }
        }
        // Pierce+reflect always rides out the full bounce (there and back to
        // the boundary) before reeling in, piercing anything along either
        // leg — it no longer cuts the bounce short just because something
        // was already pierced on the way out.
        if(hook.reflect && !hook.bounced && (hitWall || curLen>MAX_LEN)){ tryBounce(hook, tip); }
        else if(curLen>MAX_LEN || offscreen){ hook.state='retract'; }
      }
    } else if(hook.state==='retract'){
      const group = hook.attachedGroup;
      let totalW = 0;
      group.forEach(it=> totalW += it.weight);
      const sp = totalW>0 ? mine.retractSpeed/(1+totalW*mine.weightMult*0.9) : mine.retractSpeed*1.6;
      if(hook.bendPoint){
        hook.bendLen -= sp*dt;
        if(hook.bendLen<=0){
          hook.bendLen=0;
          hook.length = Math.sqrt((hook.bendPoint.x-HOOK_PIVOT.x)**2 + (hook.bendPoint.y-HOOK_PIVOT.y)**2);
          hook.bendPoint=null; hook.bendDir=null;
        }
      } else {
        hook.length -= sp*dt;
      }
      const tip = tipFor(hook);
      // Progressively collect pierced items as the line retracts back past their spot.
      if(hook.pendingGroup && hook.pendingGroup.length>0){
        const phase = hook.bendPoint ? 'bend' : 'main';
        const threshold = hook.bendPoint ? hook.bendLen : hook.length;
        hook.pendingGroup = hook.pendingGroup.filter(it=>{
          if(it._pierceLeg===phase && threshold<=it._pierceDist){
            grabItem(it); group.push(it);
            return false;
          }
          return true;
        });
      }
      group.forEach((it,i)=>{ it.x = tip.x + i*5; it.y = tip.y - i*5; });
      if(!hook.bendPoint && hook.length<=40){
        hook.length=40;
        // Fire each catch sound a beat after the last instead of all at once —
        // a pierce claw can land several items in the same frame here, and
        // playing every sound simultaneously just sounds like noise. The
        // sound itself doesn't touch `mine`, so it's still safe to fire even
        // if the mining round has already ended by the time the timer runs.
        let soundIndex = 0;
        for(const it of group){
          it.carried=false;
          if(fainted) continue;
          const res = commitItem(it);
          if(res==='fainted'){ fainted = true; continue; }
          const delayMs = soundIndex * 90;
          soundIndex++;
          if(delayMs===0) playCatchSound(it);
          else setTimeout(()=> playCatchSound(it), delayMs);
        }
        document.getElementById('mine-gold').textContent = mine.sessionValue;
        hook.attachedGroup=[]; hook.pendingGroup=[];
        hook.state='swing';
      }
    }
  }

  if(fainted){
    mine.ending = true;
    document.getElementById('mine-faint').classList.add('show');
    return;
  }

  if(mine.remaining<=0 && !mine.ending){
    mine.ending = true;
    setTimeout(()=>finishMining(), 260);
  }

  for(const p of popups){ p.y -= 28*dt; p.life -= dt; }
  popups = popups.filter(p=>p.life>0);
}

function finishMining(){
  if(!mine) return;
  const log = mine.caughtLog;
  const names = Object.keys(log);
  const totalCount = names.reduce((s,n)=>s+log[n].count,0);
  document.getElementById('mine-result-sub').textContent = totalCount + t('items_suffix');
  const list = document.getElementById('mine-result-list');
  list.innerHTML = names.map(name=>{
    const e = log[name];
    return `<div class="result-chip">
      <span class="cnt">x${e.count}</span>
      ${mineralIconHTML(e.mineral,40,true)}
      <div class="n">${minName(e.mineral)}</div>
      <div class="v">${e.mineral.price}G ${t('each_suffix')}</div>
      ${e.isNew ? '<span class="new-badge">NEW</span>' : ''}
    </div>`;
  }).join('') || `<div style="grid-column:1/-1;text-align:center;color:var(--cream-dim);padding:20px;">--</div>`;
  document.getElementById('mine-result').classList.add('show');
  // MVP jingle: fires once per results screen if this haul has a brand-new
  // discovery or an epic/legendary mineral in it. playSound() always spins up
  // a fresh, independent Audio instance rather than reusing/stopping a shared
  // one, so this plays out fully no matter what else happens on screen next.
  const isMvpHaul = names.some(n => log[n].isNew || log[n].mineral.rarity==='史诗' || log[n].mineral.rarity==='传说');
  if(isMvpHaul) playSound('mvp');
  mine = null;
}

function drawBackground(terrain){
  const bg = terrain ? ASSET['bg'+terrain.order] : null;
  if(bg && bg.loaded){
    ctx.drawImage(bg, 0, 0, W, H);
  } else {
    const sky = ctx.createLinearGradient(0,0,0,GROUND_Y);
    sky.addColorStop(0,'#bfe8ff'); sky.addColorStop(1,'#e8f7ff');
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,GROUND_Y);
    const dirt = ctx.createLinearGradient(0,GROUND_Y,0,H);
    dirt.addColorStop(0,'#8a5a2e'); dirt.addColorStop(1,'#2a1808');
    ctx.fillStyle = dirt; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0,GROUND_Y,W,6);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for(let i=0;i<50;i++){
      const x=(i*53.7)%W, y=GROUND_Y+((i*97)%(H-GROUND_Y));
      ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
    }
  }
}
// Miner artwork: fixed (hardcoded) size and position, independent of any other
// scaling math. Bottom edge is pinned to ANCHOR.y+6 (same ground line the old
// art used), so shrinking the size here won't lift the feet off the floor.
const MINER_IMG_W = 70;
const MINER_IMG_H = 104;
const MINER_IMG_X = 415;  // = ANCHOR.x(450) - MINER_IMG_W/2
const MINER_IMG_Y = 15;   // = ANCHOR.y(113) - 34 + 40 - MINER_IMG_H, keeps feet at y=119
function drawMiner(){
  const x=ANCHOR.x, y=ANCHOR.y-34;
  if(ASSET.miner && ASSET.miner.loaded){
    ctx.drawImage(ASSET.miner, MINER_IMG_X, MINER_IMG_Y, MINER_IMG_W, MINER_IMG_H);
    return;
  }
  ctx.fillStyle='#5a3a20'; ctx.fillRect(x-60,y+34,120,12);
  ctx.strokeStyle='#2c1a0c'; ctx.lineWidth=2; ctx.strokeRect(x-60,y+34,120,12);
  ctx.fillStyle='#3a6ea5'; ctx.fillRect(x-12,y,24,30);
  ctx.strokeStyle='#3a6ea5'; ctx.lineWidth=8; ctx.lineCap='round';
  const armSwing = mine.hooks[0] ? mine.hooks[0].angle : 0;
  ctx.beginPath();
  ctx.moveTo(x-12,y+6); ctx.lineTo(x-22-4*Math.sin(armSwing), y+16);
  ctx.moveTo(x+12,y+6); ctx.lineTo(x+22+4*Math.sin(armSwing), y+16);
  ctx.stroke();
  ctx.fillStyle='#f1c27d'; ctx.beginPath(); ctx.arc(x,y-8,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#d94f3d'; ctx.beginPath(); ctx.arc(x,y-12,12,Math.PI,0); ctx.fill();
  ctx.fillRect(x-14,y-12,28,4);
  ctx.fillStyle='#5a3a20'; ctx.fillRect(x-6,y-4,12,3);
}
function drawHook(hook){
  const tip = tipFor(hook);
  const start = HOOK_PIVOT;
  const curDir = hookDir(hook);
  const curAngle = Math.atan2(curDir.x, curDir.y);
  // When an item is being carried, don't draw the claw dead-center on the mineral —
  // pull it back toward the rope pivot so it sits on the near edge of the item's art,
  // and only render one prong. The missing prong reads as gripping the hidden backside.
  const carrying = hook.state==='retract' && hook.attachedGroup && hook.attachedGroup.length>0;
  let clawX = tip.x, clawY = tip.y, clawSide = 0;
  if(carrying){
    const heldItem = hook.attachedGroup[0];
    const r = (heldItem && heldItem.r) ? heldItem.r : 14;
    const pullback = r * 0.85;
    clawX = tip.x - curDir.x*pullback;
    clawY = tip.y - curDir.y*pullback;
    clawSide = 1;
  }
  // The rope should end at the claw itself, not the full un-pulled-back tip —
  // otherwise the line visibly overshoots past the claw when carrying an item.
  const lineEnd = carrying ? {x:clawX, y:clawY} : tip;
  const drawLine = () => {
    ctx.beginPath(); ctx.moveTo(start.x,start.y);
    if(hook.bendPoint) ctx.lineTo(hook.bendPoint.x,hook.bendPoint.y);
    ctx.lineTo(lineEnd.x,lineEnd.y); ctx.stroke();
  };
  if(hook.pierce && hook.reflect){
    ctx.setLineDash([8,8]); ctx.lineWidth=2.5;
    ctx.lineDashOffset=0; ctx.strokeStyle=RARITY_COLOR_HEX['稀有'];
    drawLine();
    ctx.lineDashOffset=8; ctx.strokeStyle='#4fbd6f';
    drawLine();
    ctx.setLineDash([]);
  } else {
    ctx.strokeStyle = hook.pierce ? '#4a90e2' : (hook.reflect ? '#4fbd6f' : '#2a2a2a');
    ctx.lineWidth=2.5;
    drawLine();
  }
  ctx.save(); ctx.translate(clawX,clawY); ctx.rotate(-curAngle);
  if(ASSET.claw && ASSET.claw.loaded){
    const s = 30;
    if(clawSide!==0){
      ctx.save();
      ctx.beginPath();
      ctx.rect(clawSide>0 ? 0 : -s/2, -s/2, s/2, s);
      ctx.clip();
      ctx.drawImage(ASSET.claw, -s/2, -s/2, s, s);
      ctx.restore();
    } else {
      ctx.drawImage(ASSET.claw, -s/2, -s/2, s, s);
    }
  } else {
    const openT = hook.clawOpen===undefined ? 1 : hook.clawOpen;
    const OPEN_ANGLE = 0.62, CLOSE_ANGLE = 0.16; // radians from vertical, per prong
    const prongAngle = CLOSE_ANGLE + (OPEN_ANGLE-CLOSE_ANGLE)*openT;
    const prongLen = 15, tipLen = 5;
    ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=3.5; ctx.lineCap='round'; ctx.lineJoin='round';
    const sides = clawSide!==0 ? [clawSide] : [-1,1];
    sides.forEach(side=>{
      const dx = Math.sin(prongAngle)*side, dy = Math.cos(prongAngle);
      const kx = -dx, ky = dy; // slight inward hook at the prong's tip
      const ex = dx*prongLen, ey = dy*prongLen;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(ex,ey);
      ctx.lineTo(ex+kx*tipLen, ey+ky*tipLen*0.6);
      ctx.stroke();
    });
    ctx.fillStyle='#5a5a5a'; ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawItemCanvas(it){
  ctx.save(); ctx.translate(it.x,it.y);
  // Prefer the real texture (pic/min_xxx.png) if it's been dropped in and has
  // finished loading; otherwise fall back to the procedural shape placeholder.
  const tex = it.mineral ? ASSET['min_'+it.mineral.icon] : null;
  if(tex && tex.loaded){
    // Fit the texture into the circular clip area WITHOUT stretching it to a
    // square — elongated art (e.g. long vein-shaped ore) needs its natural
    // width/height ratio preserved, or it comes out visibly squished.
    const box = it.r*2;
    const iw = tex.naturalWidth || tex.width || box;
    const ih = tex.naturalHeight || tex.height || box;
    const scale = Math.min(box/iw, box/ih);
    const dw = iw*scale, dh = ih*scale;
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,it.r,0,Math.PI*2); ctx.clip();
    ctx.drawImage(tex, -dw/2, -dh/2, dw, dh);
    ctx.restore();
  } else {
    // Base-ore items (the common filler drop for each terrain) default to a
    // neutral tan, but should still honor a per-mineral color override when
    // one exists (e.g. peat/泥煤 is the swamp's base ore and has its own color).
    const color = it.isBase ? (MINERAL_COLOR_OVERRIDE[it.mineral.name] || '#8a7a63') : mineralColor(it.mineral);
    const edge = shadeColor(color,-40);
    if(it.isBase){
      drawPoly(it.r,6,color,edge,0.15);
    } else if(it.mineral.category==='工业矿物'){
      drawPoly(it.r,6,color,edge,0.12);
    } else if(it.mineral.category==='常见宝石矿物'){
      drawDiamond(it.r,color,edge);
    } else if(it.mineral.category==='珍稀晶体矿物'){
      ctx.shadowColor=color; ctx.shadowBlur=12;
      drawStar(it.r,color,edge);
      ctx.shadowBlur=0;
    } else {
      drawBlob(it.r,color,edge);
    }
  }
  if(it.hazardType){
    ctx.font='bold 18px sans-serif'; ctx.fillStyle='#ff8b7a'; ctx.textAlign='center';
    ctx.fillText('☠',0,-it.r-6);
  }
  ctx.restore();
}
function drawPoly(r,n,fill,edge,jag){
  ctx.fillStyle=fill; ctx.strokeStyle=edge; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2, rr=r*(0.85+jag*Math.sin(i*2.3));
    const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function drawDiamond(r,fill,edge){
  ctx.fillStyle=fill; ctx.strokeStyle=edge; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*0.8,0); ctx.lineTo(0,r); ctx.lineTo(-r*0.8,0); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.moveTo(0,-r*0.55); ctx.lineTo(r*0.3,0); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
}
function drawStar(r,fill,edge){
  ctx.fillStyle=fill; ctx.strokeStyle=edge; ctx.lineWidth=1.5;
  ctx.beginPath();
  const n=6;
  for(let i=0;i<n*2;i++){
    const a=(i/(n*2))*Math.PI*2, rr= i%2===0? r : r*0.42;
    const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function drawBlob(r,fill,edge){
  ctx.fillStyle=fill; ctx.strokeStyle=edge; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,2,r*0.95,r*0.72,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=edge; ctx.beginPath(); ctx.arc(-r*0.3,-r*0.15,r*0.16,0,Math.PI*2); ctx.fill();
}
function drawMine(){
  drawBackground(mine.terrain);
  for(const it of mine.items){ if(it.alive || it.carried) drawItemCanvas(it); }
  drawMiner();
  for(const hook of mine.hooks){ drawHook(hook); }
  ctx.textAlign='center'; ctx.font='bold 19px sans-serif';
  for(const p of popups){
    ctx.globalAlpha = Math.max(0,Math.min(1,p.life));
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }
}

function loop(ts){
  if(!lastTime) lastTime=ts;
  let dt=(ts-lastTime)/1000;
  if(dt>0.05) dt=0.05;
  lastTime=ts;
  if(mine && screens.mine.classList.contains('active')){
    updateMine(dt);
    drawMine();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
