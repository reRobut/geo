<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万象矿工 Omni Miner</title>
<style>
:root{
  --bg-deep:#160f0a;
  --bg-panel:#231609;
  --bg-panel2:#2f1d0d;
  --wood-edge:#5a3a1c;
  --wood-edge2:#7a4f26;
  --cream:#f3e6c6;
  --cream-dim:#cbb98d;
  --gold:#ffcf49;
  --gold-dark:#b9860f;
  --accent:#e2793a;
  --danger:#e05a4a;
  --ok:#5ac488;
  --r-common:#b7b0a2;
  --r-uncommon:#4fbd82;
  --r-rare:#4a90e2;
  --r-epic:#b06be0;
  --r-legend:#ffb020;
  --r-base:#8a7a63;
  --pierce:#4a90e2;
  --reflect:#4fbd6f;
}
*{box-sizing:border-box;}
html,body{
  margin:0;height:100%;
  background:radial-gradient(ellipse at center, #241608 0%, #100a05 100%);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--cream);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#app{
  position:relative;width:100vw;height:100vh;
  background:var(--bg-deep);
  overflow:hidden;
}
.screen{
  position:relative;width:100%;height:100%;display:none;flex-direction:column;
}
.screen.active{display:flex;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--wood-edge2);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- HOME ---------- */
#screen-home{
  align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,207,73,.14), transparent 50%),
    radial-gradient(circle at 75% 75%, rgba(226,121,58,.20), transparent 55%),
    linear-gradient(180deg,#1c1108 0%, #0f0904 100%);
  position:relative;
}
#home-bg-img{
  position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:0;
  background-size:cover;background-position:center;
  -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 55%, transparent 92%);
  mask-image:linear-gradient(to bottom, #000 0%, #000 55%, transparent 92%);
}
.home-title{
  font-size:52px;font-weight:900;color:var(--gold);
  letter-spacing:6px;text-shadow:0 4px 0 #3a2200, 0 8px 18px rgba(0,0,0,.5);
  z-index:2;
}
.home-sub{
  font-size:16px;color:var(--cream-dim);letter-spacing:3px;margin-top:6px;z-index:2;
}
.home-btns{
  margin-top:38px;display:flex;flex-direction:column;gap:14px;z-index:2;width:280px;
}
.home-btn{
  padding:14px 0;border-radius:10px;border:2px solid var(--gold-dark);
  background:linear-gradient(180deg,#4a2f14,#2c1a08);
  color:var(--cream);font-size:17px;font-weight:700;letter-spacing:2px;
  box-shadow:0 4px 0 #140c04;transition:transform .1s;
}
.home-btn:hover{background:linear-gradient(180deg,#5c3c1a,#3a2410);}
.home-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #140c04;}
.home-btn.primary{
  background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;border-color:#a06a10;
  box-shadow:0 4px 0 #7a4f0c;
}
.home-btn.primary:hover{background:linear-gradient(180deg,#fff0ab,#ffc94f);}
.home-btn:disabled{opacity:.4;cursor:not-allowed;}
#home-sign{
  position:absolute;bottom:12px;right:18px;color:var(--cream-dim);
  font-size:12px;letter-spacing:1px;opacity:.75;z-index:2;
}
#testmode-toggle{
  position:absolute;bottom:12px;left:18px;color:var(--cream-dim);
  font-size:11px;letter-spacing:.5px;opacity:.55;z-index:2;
  border:1px solid var(--wood-edge2);border-radius:12px;padding:4px 10px;
  background:rgba(0,0,0,.2);
}
#testmode-toggle:hover{opacity:1;}
#testmode-toggle.on{opacity:1;color:var(--ok);border-color:var(--ok);}
#lang-menu{
  position:absolute;z-index:5;background:var(--bg-panel);border:2px solid var(--gold-dark);
  border-radius:10px;padding:8px;display:none;flex-direction:column;gap:4px;
  top:50%;left:50%;transform:translate(-50%,-50%);min-width:200px;
}
#lang-menu.show{display:flex;}
#lang-menu .lang-opt{
  padding:10px 14px;border-radius:6px;background:transparent;border:none;color:var(--cream);
  text-align:left;font-size:14px;
}
#lang-menu .lang-opt:hover{background:var(--bg-panel2);}
#lang-menu .lang-title{font-size:13px;color:var(--cream-dim);padding:4px 10px;}

/* ---------- MAIN HUB ---------- */
#screen-main{}
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;background:var(--bg-panel);border-bottom:3px solid var(--wood-edge);
  flex-shrink:0;
}
#gold-badge{
  display:flex;align-items:center;gap:8px;
  background:rgba(0,0,0,.3);border:2px solid var(--gold-dark);border-radius:20px;
  padding:6px 16px;font-weight:800;color:var(--gold);font-size:16px;
}
#gold-badge .coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff6cf, var(--gold) 60%, var(--gold-dark));display:inline-block;}
#tabs{display:flex;gap:6px;}
.tab-btn{
  padding:9px 20px;border-radius:8px 8px 0 0;border:2px solid var(--wood-edge2);border-bottom:none;
  background:var(--bg-panel2);color:var(--cream-dim);font-weight:700;font-size:14px;
}
.tab-btn.active{background:var(--bg-deep);color:var(--gold);border-color:var(--gold-dark);}
#home-exit-btn{
  background:none;border:1px solid var(--wood-edge2);color:var(--cream-dim);border-radius:6px;
  padding:6px 12px;font-size:12px;
}
#tab-content{flex:1;overflow-y:auto;padding:18px 22px;background:var(--bg-deep);max-width:1040px;width:100%;margin:0 auto;box-sizing:border-box;}
.panel-title{font-size:20px;font-weight:800;color:var(--gold);margin:0 0 4px;}
.panel-desc{font-size:13px;color:var(--cream-dim);margin:0 0 16px;}

/* map */
#map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:stretch;}
.terrain-card{
  background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:12px;
  padding:14px 16px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.terrain-card.locked{opacity:.55;filter:grayscale(.4);}
.terrain-card h3{margin:0 0 4px;font-size:17px;color:var(--cream);}
.terrain-card .tag{font-size:11px;color:var(--gold);background:rgba(255,207,73,.12);border:1px solid var(--gold-dark);border-radius:10px;padding:2px 8px;display:inline-block;margin-bottom:6px;}
.terrain-card .meta{font-size:12.5px;color:var(--cream-dim);line-height:1.7;}
.terrain-card .enter-btn{
  margin-top:auto;width:100%;padding:8px;border-radius:7px;border:2px solid var(--gold-dark);
  background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;font-weight:800;font-size:13px;
}
.terrain-card .enter-btn:disabled{background:#3a3226;color:#8a8065;border-color:#4a4030;}
.terrain-card .lock-note{font-size:12px;color:var(--danger);margin-top:8px;}

/* shop */
#shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px;}
.shop-card{background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;}
.shop-card h3{margin:0 0 6px;font-size:15.5px;color:var(--cream);display:flex;justify-content:space-between;gap:8px;}
.shop-card p{margin:0 0 10px;font-size:12.5px;color:var(--cream-dim);line-height:1.6;flex:1;}
.shop-card .buy-btn{width:100%;padding:8px;border-radius:7px;border:2px solid var(--gold-dark);background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;font-weight:800;font-size:13px;margin-top:auto;}
.shop-card .buy-btn.owned{background:#2c3a2c;color:var(--ok);border-color:#3d5a3d;cursor:default;}
.shop-card .buy-btn:disabled:not(.owned){background:#3a3226;color:#8a8065;border-color:#4a4030;}
.price-tag{color:var(--gold);font-weight:800;white-space:nowrap;}
.shop-section-title{font-size:15px;font-weight:800;color:var(--cream);margin:4px 0 10px;border-left:3px solid var(--gold);padding-left:8px;}
#hookslot-card{background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
#claw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.claw-slot-card{background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:12px;padding:12px 14px;}
.claw-slot-card.disabled{opacity:.4;}
.claw-slot-card h4{margin:0 0 8px;font-size:13.5px;color:var(--cream);}
.claw-upg-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;}
.claw-upg-row button{padding:5px 10px;border-radius:6px;border:1px solid var(--gold-dark);background:rgba(255,207,73,.12);color:var(--gold);font-size:11px;}
.claw-upg-row button.owned{background:#2c3a2c;color:var(--ok);border-color:#3d5a3d;}
.claw-upg-row button:disabled:not(.owned){opacity:.4;}
.dot-pierce{color:var(--pierce);}
.dot-reflect{color:var(--reflect);}

/* warehouse */
#wh-summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
#wh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.wh-item{background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:10px;padding:10px 8px;text-align:center;position:relative;}
.wh-item.locked-item{border-color:var(--gold-dark);}
.icon-wrap{position:relative;display:block;}
.wh-item .icon{width:38px;height:38px;margin:0 auto 6px;}
.wh-item .name{font-size:12px;color:var(--cream);margin-bottom:2px;}
.wh-item .count{font-size:11px;color:var(--cream-dim);}
.wh-item .btn-row{display:flex;gap:4px;margin-top:6px;}
.wh-item .btn-row button{flex:1;padding:5px 2px;font-size:10px;border-radius:6px;border:1px solid var(--gold-dark);background:rgba(255,207,73,.12);color:var(--gold);}
.wh-item .btn-row button:disabled{opacity:.35;}
.lock-toggle{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:5px;border:1px solid var(--wood-edge2);background:rgba(0,0,0,.35);font-size:11px;color:var(--cream-dim);display:flex;align-items:center;justify-content:center;}
.lock-toggle.locked{background:var(--gold-dark);color:#3a2200;}
#wh-empty{color:var(--cream-dim);font-size:13px;padding:30px;text-align:center;}

/* dex */
.dex-section{margin-bottom:24px;position:relative;}
.dex-section:last-of-type{margin-bottom:0;}
.dex-section-title{
  display:flex;align-items:center;gap:8px;margin:0 0 12px;padding-bottom:8px;
  border-bottom:2px solid var(--wood-edge2);
}
.dex-section-title .idx{
  font-size:11px;font-weight:800;color:#3a2200;background:var(--gold);
  border-radius:10px;padding:2px 9px;flex-shrink:0;
}
.dex-section-title .tname{font-size:14.5px;font-weight:800;color:var(--cream);}
.dex-section-title .tcount{font-size:11.5px;color:var(--cream-dim);margin-left:auto;}
.dex-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;position:relative;}
#dex-tooltip{
  display:none;position:absolute;z-index:15;max-width:220px;pointer-events:none;
  background:var(--bg-panel2);border:1px solid var(--gold-dark);border-radius:8px;
  padding:8px 10px;font-size:11.5px;color:var(--cream);box-shadow:0 6px 16px rgba(0,0,0,.5);line-height:1.5;
}
#dex-tooltip b{color:var(--gold);font-size:12.5px;}
.dex-tooltip-formula{color:var(--cream-dim);margin-top:2px;}
.dex-tooltip-note{color:var(--cream-dim);margin-top:4px;font-size:11px;}
.dex-item{background:var(--bg-panel);border:2px solid var(--wood-edge2);border-radius:10px;padding:8px 6px;text-align:center;position:relative;}
.dex-item.locked{filter:grayscale(1) brightness(.5);}
.dex-item .icon{width:34px;height:34px;margin:0 auto 4px;}
.dex-item .name{font-size:10.5px;color:var(--cream);}
.dex-item .rar{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;}
#dex-detail{
  position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(10,6,3,.85);display:none;align-items:center;justify-content:center;z-index:20;
}
#dex-detail.show{display:flex;}
#dex-detail-card{background:var(--bg-panel);border:3px solid var(--gold-dark);border-radius:14px;padding:22px 26px;width:320px;text-align:center;}
#dex-detail-card .icon{width:70px;height:70px;margin:0 auto 10px;}
#dex-detail-card h3{margin:0 0 4px;color:var(--cream);}
#dex-detail-card .rarline{font-size:12px;margin-bottom:10px;}
#dex-detail-card .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--cream-dim);padding:4px 0;border-top:1px solid var(--wood-edge);}
#dex-detail-card .note{font-size:11.5px;color:var(--cream-dim);margin-top:10px;line-height:1.6;}
#dex-detail-close{margin-top:14px;padding:7px 20px;border-radius:7px;border:1px solid var(--wood-edge2);background:var(--bg-panel2);color:var(--cream);}

/* ---------- MINE SCREEN ---------- */
#screen-mine{background:#000;align-items:center;justify-content:center;}
#mine-canvas-wrap{
  position:relative;
  width:min(100%, 1200px, calc(100vh * 900 / 560));
  aspect-ratio:900/560;
  max-height:100%;
  margin:0 auto;
}
canvas#mineCanvas{display:block;background:#000;width:100%;height:100%;}
#mine-hud{
  position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:10px 16px;pointer-events:none;font-weight:700;
}
.mine-box{background:rgba(20,12,6,.6);border:2px solid var(--gold-dark);border-radius:8px;padding:6px 14px;font-size:14px;color:var(--cream);text-shadow:0 2px 3px rgba(0,0,0,.6);text-align:center;}
.mine-box .big{font-size:18px;color:var(--gold);}
#mine-hud-right{display:flex;align-items:center;gap:8px;pointer-events:auto;}
#mine-leave-btn{
  padding:9px 14px;border-radius:8px;border:2px solid var(--wood-edge2);
  background:rgba(20,12,6,.7);color:var(--cream);font-size:12.5px;font-weight:700;
  text-shadow:0 2px 3px rgba(0,0,0,.6);
}
#mine-suit{background:rgba(20,12,6,.6);border:2px solid var(--ok);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--ok);text-align:center;}
#mine-timer{
  position:absolute;bottom:16px;right:16px;width:92px;height:92px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:3px solid var(--gold-dark);box-shadow:0 4px 14px rgba(0,0,0,.55);
}
#mine-timer-inner{
  width:74px;height:74px;border-radius:50%;background:#160f0a;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;color:var(--gold);
  text-shadow:0 2px 3px rgba(0,0,0,.6);
}
#mine-timer.urgent{border-color:var(--danger);}
#mine-timer.urgent #mine-timer-inner{color:var(--danger);}
#mine-hint{position:absolute;bottom:20px;left:0;right:130px;text-align:center;color:#f4e5c0;font-size:12.5px;opacity:.85;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6);}
#mine-result,#mine-faint{
  position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(10,6,3,.88);display:none;align-items:center;justify-content:center;
}
#mine-result.show,#mine-faint.show{display:flex;}
#mine-result-card{background:var(--bg-panel);border:3px solid var(--gold-dark);border-radius:16px;padding:24px 30px;width:460px;max-height:520px;display:flex;flex-direction:column;}
#mine-result-card h2{margin:0 0 4px;color:var(--gold);text-align:center;}
#mine-result-sub{text-align:center;color:var(--cream-dim);font-size:13px;margin-bottom:14px;}
#mine-result-list{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.result-chip{background:var(--bg-panel2);border:1px solid var(--wood-edge2);border-radius:8px;padding:6px;text-align:center;position:relative;}
.result-chip .icon{width:28px;height:28px;margin:0 auto 3px;}
.result-chip .n{font-size:10px;color:var(--cream);}
.result-chip .v{font-size:9.5px;color:var(--gold-dark);}
.result-chip .cnt{position:absolute;top:2px;right:4px;font-size:10px;color:var(--gold);font-weight:800;}
#mine-result-btn{padding:10px;border-radius:9px;border:2px solid var(--gold-dark);background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;font-weight:800;}
#mine-faint-card{background:var(--bg-panel);border:3px solid var(--danger);border-radius:16px;padding:28px 32px;width:380px;text-align:center;}
#mine-faint-card .skull{font-size:44px;margin-bottom:10px;}
#mine-faint-card h2{margin:0 0 10px;color:var(--danger);}
#mine-faint-card p{color:var(--cream-dim);font-size:13.5px;line-height:1.7;margin:0 0 18px;}
#mine-faint-btn{padding:10px 24px;border-radius:9px;border:2px solid var(--gold-dark);background:linear-gradient(180deg,#ffe27a,#ffb92e);color:#4a2c00;font-weight:800;}

</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div id="home-bg-img"></div>
    <div class="home-title" id="t-title">万象矿工</div>
    <div class="home-sub" id="t-subtitle">OMNI MINER</div>
    <div class="home-btns">
      <button class="home-btn primary" id="btn-newgame">开始游戏</button>
      <button class="home-btn" id="btn-continue" disabled>继续游戏</button>
      <button class="home-btn" id="btn-lang">🌐 语言选择</button>
    </div>
    <div id="home-sign">by 纯一星鸣</div>
    <div id="testmode-toggle">测试模式：<span id="testmode-state">关</span></div>
    <div id="lang-menu">
      <div class="lang-title">选择语言 / Select language</div>
      <button class="lang-opt" data-lang="zh">中文（简体）</button>
      <button class="lang-opt" data-lang="en">English</button>
    </div>
  </div>

  <!-- MAIN HUB -->
  <div class="screen" id="screen-main">
    <div id="topbar">
      <div id="gold-badge"><span class="coin"></span><span id="gold-amount">0</span></div>
      <div id="tabs">
        <button class="tab-btn active" data-tab="map" id="tab-map">地图</button>
        <button class="tab-btn" data-tab="shop" id="tab-shop">商店</button>
        <button class="tab-btn" data-tab="warehouse" id="tab-warehouse">仓库</button>
        <button class="tab-btn" data-tab="dex" id="tab-dex">图鉴</button>
      </div>
      <button id="home-exit-btn">回到主页</button>
    </div>
    <div id="tab-content"></div>
  </div>

  <!-- MINE -->
  <div class="screen" id="screen-mine">
    <div id="mine-canvas-wrap">
      <canvas id="mineCanvas" width="900" height="560"></canvas>
      <div id="mine-hud">
        <div class="mine-box" id="t-total-earn">总收益<br><span class="big" id="mine-gold">0</span></div>
        <div class="mine-box" id="mine-terrain-name">-</div>
        <div id="mine-hud-right">
          <button id="mine-leave-btn">结束挖掘</button>
          <div class="mine-box" id="t-remain">剩余矿物<br><span class="big" id="mine-remain">0/12</span></div>
        </div>
      </div>
      <div id="mine-timer"><div id="mine-timer-inner"><span id="mine-timer-num">30</span></div></div>
      <div id="mine-hint">点击画面或按【空格】发射钩爪</div>
      <div id="mine-result">
        <div id="mine-result-card">
          <h2 id="t-haul-title">本次收获</h2>
          <div id="mine-result-sub"></div>
          <div id="mine-result-list"></div>
          <button id="mine-result-btn">确认入库，返回地图</button>
        </div>
      </div>
      <div id="mine-faint">
        <div id="mine-faint-card">
          <div class="skull">☠</div>
          <h2 id="t-faint-title">采矿中断</h2>
          <p id="t-faint-msg">接触有毒矿物，你已晕倒。请去商店购买防护用品。</p>
          <button id="mine-faint-btn">前往商店</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dex-detail">
    <div id="dex-detail-card"></div>
  </div>

// ---------------- ASSET LOADER (art placeholders -> real art via pic/ folder) ----------------
// All art below is optional: if a file is missing, the game silently keeps using the
// procedurally-drawn placeholder that already exists (SVG icons / canvas shapes).
// Drop files with the exact names listed below into the pic/ folder to replace placeholders.
const ASSET = {};
function loadAsset(key, src, onReady){
  const img = new Image();
  img.loaded = false;
  img.onload = () => { img.loaded = true; if(onReady) onReady(img); };
  img.onerror = () => { img.loaded = false; };
  img.src = src;
  ASSET[key] = img;
}
loadAsset('bg_main', 'pic/bg_main.png', () => {
  const el = document.getElementById('home-bg-img');
  if(el) el.style.backgroundImage = "url('pic/bg_main.png')";
});
TERRAINS.forEach(tr => loadAsset('bg'+tr.order, 'pic/bg'+tr.order+'.png'));
loadAsset('miner', 'pic/miner.png');
loadAsset('claw', 'pic/claw.png');
MINERALS.forEach(m => loadAsset('min_'+m.icon, 'pic/'+m.icon));

const SOUND_SRC = {
  buy: 'sound/coin.mp3',
  sell: 'sound/gold.mp3',
  catchBase: 'sound/stone.wav',
  catchCommon: 'sound/wood.wav',
  catchRareUncommon: 'sound/glass.mp3',   // 稀有/少见
  catchLegendaryEpic: 'sound/metal.wav',  // 传说/史诗
};
function playSound(key){
  const src = SOUND_SRC[key];
  if(!src) return;
  try{
    const a = new Audio(src);
    a.volume = 0.55;
    a.play().catch(()=>{}); // ignore autoplay-blocked errors
  }catch(e){}
}
// Picks the right "caught a mineral" sound based on what was caught.
function playCatchSound(item){
  if(item.isBase){ playSound('catchBase'); return; }
  const r = item.mineral.rarity;
  if(r==='传说' || r==='史诗') playSound('catchLegendaryEpic');
  else if(r==='稀有' || r==='少见') playSound('catchRareUncommon');
  else playSound('catchCommon');
}

// Returns markup for a mineral icon: the procedural SVG placeholder underneath,
// with the real art image layered on top (auto-hides itself via onerror until
// the matching pic/ file actually exists).
function mineralIconHTML(m, size, found){
  const half = size/2;
  const svgInner = found ? mineralSVG(m, half, half) : `<circle cx="${half}" cy="${half}" r="${half-6}" fill="#3a3226"/>`;
  const svg = `<svg class="icon" viewBox="0 0 ${size} ${size}" style="position:absolute;top:0;right:0;bottom:0;left:0;">${svgInner}</svg>`;
  if(!found) return `<span class="icon icon-wrap">${svg}</span>`;
  return `<span class="icon icon-wrap">${svg}<img src="pic/${m.icon}" class="icon-img" style="position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none'"></span>`;
}

const CAT_KEY = {'工业矿物':'industrial','常见宝石矿物':'gem','珍稀晶体矿物':'crystal','化石':'fossil'};
const RAR_KEY = {'普通':'r_common','少见':'r_uncommon','稀有':'r_rare','史诗':'r_epic','传说':'r_legend'};

let lang = 'zh';
function t(key){ return I18N[lang][key]; }

// ---------------- EQUIPMENT (one-time boolean) ----------------
const EQUIPMENT = [
  {id:'winch', key:'equip_winch', cost:600},
  {id:'light', key:'equip_light', cost:500},
  {id:'luck',  key:'equip_luck',  cost:1200},
  {id:'dive',  key:'equip_dive',  cost:700, unlocks:'海底/海岸礁石'},
  {id:'cold',  key:'equip_cold',  cost:700, unlocks:'极地/雪原冰川'},
  {id:'heat',  key:'equip_heat',  cost:800, unlocks:'火山/熔岩区'},
];
const TERRAIN_GEAR = {'海底/海岸礁石':'dive','极地/雪原冰川':'cold','火山/熔岩区':'heat'};
TERRAINS.forEach(tr => tr.unlocks_req = TERRAIN_GEAR[tr.name] || null);

// ---------------- upgrade cost curves ----------------
function timeUpgradeCost(level){ return Math.round(200*Math.pow(1.4, level)/10)*10; }
function detectorUpgradeCost(level){ return Math.round(220*Math.pow(1.32, level)/10)*10; }
function hookSlotCost(fromCount){ return fromCount===1 ? 2000 : 4500; }
function pierceCost(slot){ return 600 + (slot-1)*400; }
function reflectCost(slot){ return 550 + (slot-1)*350; }
function suitCost(count){ return 350; }

// ---------------- GAME STATE ----------------
let game = null;
let mine = null;

function freshGame(){
  return {
    gold: 0,
    discovered: {},
    inventory: {},
    locked: {},
    owned: {},
    timeLevel: 0,
    detectorLevel: 0,
    hookSlots: 1,
    hookUpgrades: {1:{pierce:false,reflect:false},2:{pierce:false,reflect:false},3:{pierce:false,reflect:false}},
    suitCharges: 0,
    testMode: false,
    started: true,
  };
}

function discoveredCount(){ return Object.keys(game.discovered).length; }

function terrainUnlocked(terr){
  if(game.testMode) return true;
  if(discoveredCount() < terr.unlockThreshold) return false;
  if(terr.unlocks_req && !game.owned[terr.unlocks_req]) return false;
  return true;
}

// ---------------- SCREENS ----------------
const screens = {
  home: document.getElementById('screen-home'),
  main: document.getElementById('screen-main'),
  mine: document.getElementById('screen-mine'),
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

let testModeEnabled = false;

document.getElementById('btn-newgame').addEventListener('click', ()=>{
  game = freshGame();
  if(testModeEnabled){ game.testMode = true; game.gold = Math.max(game.gold, 9999); }
  document.getElementById('btn-continue').disabled = false;
  enterMain();
});
document.getElementById('btn-continue').addEventListener('click', ()=>{
  if(game) enterMain();
});
document.getElementById('btn-lang').addEventListener('click', ()=>{
  document.getElementById('lang-menu').classList.add('show');
});
document.getElementById('lang-menu').addEventListener('click', (e)=>{
  const b = e.target.closest('.lang-opt');
  if(b){ lang = b.dataset.lang; applyStaticText(); }
  document.getElementById('lang-menu').classList.remove('show');
});
document.getElementById('home-exit-btn').addEventListener('click', ()=>{
  showScreen('home');
});
document.getElementById('testmode-toggle').addEventListener('click', ()=>{
  testModeEnabled = !testModeEnabled;
  if(!game){ game = freshGame(); document.getElementById('btn-continue').disabled=false; }
  game.testMode = testModeEnabled;
  if(testModeEnabled) game.gold = Math.max(game.gold, 9999);
  const el = document.getElementById('testmode-toggle');
  el.classList.toggle('on', testModeEnabled);
  document.getElementById('testmode-state').textContent = testModeEnabled ? (lang==='zh'?'开':'ON') : (lang==='zh'?'关':'OFF');
  if(screens.main.classList.contains('active')) renderTab(currentTab);
});

function applyStaticText(){
  document.getElementById('t-title').textContent = t('title');
  document.getElementById('t-subtitle').textContent = t('subtitle');
  document.getElementById('btn-newgame').textContent = t('newgame');
  document.getElementById('btn-continue').textContent = t('continue_');
  document.getElementById('btn-lang').textContent = t('lang');
  document.getElementById('tab-map').textContent = t('tab_map');
  document.getElementById('tab-shop').textContent = t('tab_shop');
  document.getElementById('tab-warehouse').textContent = t('tab_warehouse');
  document.getElementById('tab-dex').textContent = t('tab_dex');
  document.getElementById('home-exit-btn').textContent = t('exit');
  document.getElementById('t-total-earn').innerHTML = t('total_earn')+'<br><span class="big" id="mine-gold">'+ (mine?mine.sessionValue:0) +'</span>';
  document.getElementById('t-remain').innerHTML = t('remain')+'<br><span class="big" id="mine-remain">0/10</span>';
  document.getElementById('mine-leave-btn').textContent = t('leave');
  document.getElementById('mine-hint').textContent = t('hint');
  document.getElementById('t-haul-title').textContent = t('haul_title');
  document.getElementById('mine-result-btn').textContent = t('confirm');
  document.getElementById('t-faint-title').textContent = t('faint_title');
  document.getElementById('t-faint-msg').textContent = t('faint_msg');
  document.getElementById('mine-faint-btn').textContent = t('faint_btn');
  if(screens.main.classList.contains('active')) renderTab(currentTab);
}
applyStaticText();

function enterMain(){
  showScreen('main');
  document.getElementById('gold-amount').textContent = game.gold;
  renderTab(currentTab);
}

// ---------------- TABS ----------------
let currentTab = 'map';
document.getElementById('tabs').addEventListener('click', (e)=>{
  const b = e.target.closest('.tab-btn');
  if(!b) return;
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  currentTab = b.dataset.tab;
  renderTab(currentTab);
});

function renderTab(tab){
  document.getElementById('gold-amount').textContent = game.gold;
  const el = document.getElementById('tab-content');
  if(tab==='map') el.innerHTML = renderMap();
  else if(tab==='shop') el.innerHTML = renderShop();
  else if(tab==='warehouse') el.innerHTML = renderWarehouse();
  else if(tab==='dex') el.innerHTML = renderDex();
  bindTabEvents(tab);
}

// ---------------- MAP TAB ----------------
function renderMap(){
  let cards = TERRAINS.map(tr=>{
    const unlocked = terrainUnlocked(tr);
    const dCount = discoveredCount();
    let noteHtml = '';
    if(!unlocked){
      if(dCount < tr.unlockThreshold){
        noteHtml += `<div class="lock-note">${t('locked_need').replace('{n}',dCount).replace('{t}',tr.unlockThreshold)}</div>`;
      }
      if(tr.unlocks_req && !game.owned[tr.unlocks_req]){
        const eq = EQUIPMENT.find(e=>e.id===tr.unlocks_req);
        noteHtml += `<div class="lock-note">${t('need_gear')}${I18N[lang][eq.key].n}</div>`;
      }
    }
    const priceLabel = tr.isFree ? t('free') : (tr.ticket+' G');
    const canAfford = tr.isFree || game.gold >= tr.ticket;
    return `<div class="terrain-card ${unlocked?'':'locked'}">
      <span class="tag">#${tr.order}</span>
      <h3>${tr.name}</h3>
      <div class="meta">${t('enter')}: <b style="color:var(--gold)">${priceLabel}</b></div>
      ${noteHtml}
      <button class="enter-btn" data-terrain="${tr.name}" ${(!unlocked || !canAfford)?'disabled':''}>
        ${unlocked ? (canAfford? t('enter') : t('not_enough_gold')) : '🔒'}
      </button>
    </div>`;
  }).join('');
  return `<div class="panel-title">${t('map_title')}</div><div class="panel-desc">${t('map_desc')}</div><div id="map-grid">${cards}</div>`;
}

function bindTabEvents(tab){
  if(tab==='map'){
    document.querySelectorAll('.enter-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const trName = b.dataset.terrain;
        const tr = TERRAINS.find(x=>x.name===trName);
        if(!tr.isFree){ game.gold -= tr.ticket; playSound('buy'); }
        startMining(tr);
      });
    });
  } else if(tab==='shop'){
    document.querySelectorAll('.buy-btn[data-equip]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = b.dataset.equip;
        const eq = EQUIPMENT.find(x=>x.id===id);
        if(game.owned[id] || game.gold < eq.cost) return;
        game.gold -= eq.cost;
        game.owned[id] = true;
        playSound('buy');
        renderTab('shop');
      });
    });
    const timeBtn = document.getElementById('buy-time-btn');
    if(timeBtn) timeBtn.addEventListener('click', ()=>{
      const cost = timeUpgradeCost(game.timeLevel);
      if(game.gold < cost) return;
      game.gold -= cost; game.timeLevel++; playSound('buy'); renderTab('shop');
    });
    const detBtn = document.getElementById('buy-det-btn');
    if(detBtn) detBtn.addEventListener('click', ()=>{
      const cost = detectorUpgradeCost(game.detectorLevel);
      if(game.gold < cost || BASE_DIG_COUNT+game.detectorLevel >= MAX_DIG_COUNT) return;
      game.gold -= cost; game.detectorLevel++; playSound('buy'); renderTab('shop');
    });
    const suitBtn = document.getElementById('buy-suit-btn');
    if(suitBtn) suitBtn.addEventListener('click', ()=>{
      const cost = suitCost();
      if(game.gold < cost) return;
      game.gold -= cost; game.suitCharges += 10; playSound('buy'); renderTab('shop');
    });
    const slotBtn = document.getElementById('buy-slot-btn');
    if(slotBtn) slotBtn.addEventListener('click', ()=>{
      if(game.hookSlots>=3) return;
      const cost = hookSlotCost(game.hookSlots);
      if(game.gold < cost) return;
      game.gold -= cost; game.hookSlots++; playSound('buy'); renderTab('shop');
    });
    document.querySelectorAll('.buy-pierce').forEach(b=>{
      b.addEventListener('click', ()=>{
        const slot = +b.dataset.slot;
        if(game.hookUpgrades[slot].pierce) return;
        const cost = pierceCost(slot);
        if(game.gold < cost) return;
        game.gold -= cost; game.hookUpgrades[slot].pierce = true; playSound('buy'); renderTab('shop');
      });
    });
    document.querySelectorAll('.buy-reflect').forEach(b=>{
      b.addEventListener('click', ()=>{
        const slot = +b.dataset.slot;
        if(game.hookUpgrades[slot].reflect) return;
        const cost = reflectCost(slot);
        if(game.gold < cost) return;
        game.gold -= cost; game.hookUpgrades[slot].reflect = true; playSound('buy'); renderTab('shop');
      });
    });
  } else if(tab==='warehouse'){
    document.querySelectorAll('.sell-one').forEach(b=>{
      b.addEventListener('click', ()=>{ sellOne(b.dataset.name); renderTab('warehouse'); });
    });
    document.querySelectorAll('.sell-stack').forEach(b=>{
      b.addEventListener('click', ()=>{
        const name = b.dataset.name;
        const c = game.inventory[name]||0;
        for(let i=0;i<c;i++) sellOne(name);
        renderTab('warehouse');
      });
    });
    document.querySelectorAll('.lock-toggle').forEach(b=>{
      b.addEventListener('click', ()=>{
        const name = b.dataset.name;
        game.locked[name] = !game.locked[name];
        renderTab('warehouse');
      });
    });
  } else if(tab==='dex'){
    document.querySelectorAll('.dex-item').forEach(b=>{
      b.addEventListener('click', ()=> openDexDetail(b.dataset.name));
      b.addEventListener('mouseenter', (e)=> showDexTooltip(e, b.dataset.name));
      b.addEventListener('mousemove', (e)=> positionDexTooltip(e));
      b.addEventListener('mouseleave', hideDexTooltip);
    });
  }
}

function sellOne(name){
  if(game.locked[name]) return;
  if(!game.inventory[name] || game.inventory[name]<=0) return;
  game.inventory[name]--;
  if(game.inventory[name]<=0) delete game.inventory[name];
  game.gold += MIN_BY_NAME[name].price;
  playSound('sell');
}

// ---------------- SHOP TAB ----------------
function renderShop(){
  const cards = EQUIPMENT.map(eq=>{
    const owned = !!game.owned[eq.id];
    const label = I18N[lang][eq.key];
    return `<div class="shop-card">
      <h3>${label.n} <span class="price-tag">${eq.cost} G</span></h3>
      <p>${label.d}</p>
      <button class="buy-btn ${owned?'owned':''}" data-equip="${eq.id}" ${(owned || game.gold<eq.cost)?'disabled':''}>
        ${owned ? t('owned') : t('buy')}
      </button>
    </div>`;
  }).join('');

  const nextTimeCost = timeUpgradeCost(game.timeLevel);
  const curTime = BASE_DIG_TIME + game.timeLevel*5;
  const timeCard = `<div class="shop-card">
      <h3>${t('shop_time_n')} <span class="price-tag">${nextTimeCost} G</span></h3>
      <p>${t('shop_time_d')}<br>${t('time_cur')}: <b style="color:var(--gold)">${curTime}s</b></p>
      <button class="buy-btn" id="buy-time-btn" ${game.gold<nextTimeCost?'disabled':''}>${t('buy_short')}</button>
    </div>`;

  const curDig = BASE_DIG_COUNT + game.detectorLevel;
  const detMaxed = curDig >= MAX_DIG_COUNT;
  const nextDetCost = detectorUpgradeCost(game.detectorLevel);
  const detCard = `<div class="shop-card">
      <h3>${t('shop_det_n')} <span class="price-tag">${detMaxed? '' : nextDetCost+' G'}</span></h3>
      <p>${t('shop_det_d')}<br>${t('det_cur')}: <b style="color:var(--gold)">${curDig}</b></p>
      <button class="buy-btn ${detMaxed?'owned':''}" id="buy-det-btn" ${(detMaxed || game.gold<nextDetCost)?'disabled':''}>${detMaxed? t('max_lv') : t('buy_short')}</button>
    </div>`;

  const suitCostVal = suitCost();
  const suitCard = `<div class="shop-card">
      <h3>${t('shop_suit_n')} <span class="price-tag">${suitCostVal} G</span></h3>
      <p>${t('shop_suit_d')}<br>${t('suit_cur')}: <b style="color:var(--gold)">${game.suitCharges}</b></p>
      <button class="buy-btn" id="buy-suit-btn" ${game.gold<suitCostVal?'disabled':''}>${t('buy_short')}</button>
    </div>`;

  const slotMaxed = game.hookSlots>=3;
  const nextSlotCost = hookSlotCost(game.hookSlots);
  const hookSlotBlock = `<div id="hookslot-card">
    <div class="shop-section-title">${t('hookslot_title')}</div>
    <p style="margin:0 0 10px;font-size:12.5px;color:var(--cream-dim);">${t('hookslot_desc')}<br>${t('hookslot_cur')}: <b style="color:var(--gold)">${game.hookSlots}/3</b></p>
    <button class="buy-btn ${slotMaxed?'owned':''}" id="buy-slot-btn" style="width:auto;padding:8px 20px;" ${(slotMaxed || game.gold<nextSlotCost)?'disabled':''}>
      ${slotMaxed? t('max_lv') : t('hookslot_buy')+' ('+nextSlotCost+' G)'}
    </button>
  </div>`;

  const clawCards = [1,2,3].map(slot=>{
    const unlocked = slot <= game.hookSlots;
    const up = game.hookUpgrades[slot];
    const pCost = pierceCost(slot), rCost = reflectCost(slot);
    return `<div class="claw-slot-card ${unlocked?'':'disabled'}">
      <h4>${t('claw_n').replace('{n}',slot)} ${unlocked?'':'· '+t('claw_locked')}</h4>
      <div class="claw-upg-row">
        <span class="dot-pierce">● ${t('pierce_n')}</span>
        <button class="buy-pierce ${up.pierce?'owned':''}" data-slot="${slot}" ${(!unlocked||up.pierce||game.gold<pCost)?'disabled':''}>
          ${up.pierce? t('owned') : pCost+'G'}
        </button>
      </div>
      <div class="claw-upg-row">
        <span class="dot-reflect">● ${t('reflect_n')}</span>
        <button class="buy-reflect ${up.reflect?'owned':''}" data-slot="${slot}" ${(!unlocked||up.reflect||game.gold<rCost)?'disabled':''}>
          ${up.reflect? t('owned') : rCost+'G'}
        </button>
      </div>
    </div>`;
  }).join('');

  return `<div class="panel-title">${t('shop_title')}</div><div class="panel-desc">${t('shop_desc')}</div>
    <div id="shop-grid">${timeCard}${detCard}${suitCard}${cards}</div>
    ${hookSlotBlock}
    <div class="shop-section-title">${t('claw_title')}</div>
    <div id="claw-grid">${clawCards}</div>`;
}

// ---------------- WAREHOUSE TAB ----------------
function renderWarehouse(){
  const names = Object.keys(game.inventory);
  if(names.length===0){
    return `<div class="panel-title">${t('wh_title')}</div><div class="panel-desc">${t('wh_desc')}</div><div id="wh-empty">${t('wh_empty')}</div>`;
  }
  let totalVal = 0;
  const items = names.map(name=>{
    const m = MIN_BY_NAME[name];
    const c = game.inventory[name];
    const locked = !!game.locked[name];
    totalVal += m.price*c;
    return `<div class="wh-item ${locked?'locked-item':''}">
      <button class="lock-toggle ${locked?'locked':''}" data-name="${name}">${locked?'🔒':'🔓'}</button>
      ${mineralIconHTML(m,40,true)}
      <div class="name">${name}</div>
      <div class="count">x${c} · ${m.price}G</div>
      <div class="btn-row">
        <button class="sell-one" data-name="${name}" ${locked?'disabled':''}>${t('sell_one')}</button>
        <button class="sell-stack" data-name="${name}" ${locked?'disabled':''}>${t('sell_all')}</button>
      </div>
    </div>`;
  }).join('');
  return `<div class="panel-title">${t('wh_title')}</div><div class="panel-desc">${t('wh_desc')}</div>
    <div id="wh-summary"><div>${t('total_value')}: <b style="color:var(--gold)">${totalVal} G</b></div></div>
    <div id="wh-grid">${items}</div>`;
}

// ---------------- DEX TAB (grouped by terrain, so players know where to farm) ----------------
// Build a name -> [terrain order,...] lookup once, from TERRAINS' baseOre + minerals lists.
const TERRAIN_OF_MINERAL = {};
TERRAINS.forEach(tr=>{
  [tr.baseOre, ...tr.minerals].forEach(n=>{
    (TERRAIN_OF_MINERAL[n] = TERRAIN_OF_MINERAL[n] || []).push(tr.order);
  });
});
const UNASSIGNED_KEY = 'unassigned';
function dexItemHTML(m){
  const found = game.testMode || !!game.discovered[m.name];
  return `<div class="dex-item ${found?'':'locked'}" data-name="${m.name}">
    <div class="rar" style="background:${RARITY_COLOR_HEX[m.rarity]}"></div>
    ${mineralIconHTML(m,40,found)}
    <div class="name">${found?m.name:'？？？'}</div>
  </div>`;
}
function dexSectionHTML(idxLabel, title, list){
  if(!list.length) return '';
  const foundCount = list.filter(m=> game.testMode || !!game.discovered[m.name]).length;
  return `<div class="dex-section">
    <div class="dex-section-title">
      ${idxLabel!==null ? `<span class="idx">#${idxLabel}</span>` : ''}
      <span class="tname">${title}</span>
      <span class="tcount">${foundCount}/${list.length}</span>
    </div>
    <div class="dex-grid">${list.map(dexItemHTML).join('')}</div>
  </div>`;
}
function renderDex(){
  const total = MINERALS.length, found = game.testMode ? total : discoveredCount();
  const sections = TERRAINS.map(tr=>{
    const list = MINERALS.filter(m=> (TERRAIN_OF_MINERAL[m.name]||[]).includes(tr.order));
    return dexSectionHTML(tr.order, tr.name, list);
  }).join('');
  const unassigned = MINERALS.filter(m=>!TERRAIN_OF_MINERAL[m.name]);
  const otherSection = dexSectionHTML(null, t('dex_other'), unassigned);
  return `<div class="panel-title">${t('dex_title')}</div>
  <div class="panel-desc">${t('dex_desc')} — ${t('dex_progress')} ${found}/${total}</div>
  ${sections}${otherSection}
  <div id="dex-tooltip"></div>`;
}
function showDexTooltip(e, name){
  const found = game.testMode || !!game.discovered[name];
  if(!found) return; // don't spoil undiscovered minerals on hover
  const m = MIN_BY_NAME[name];
  if(!m.formula && !m.note) return;
  const tip = document.getElementById('dex-tooltip');
  if(!tip) return;
  tip.innerHTML = `<b>${m.name}</b>`
    + (m.formula ? `<div class="dex-tooltip-formula">${t('formula')}: ${m.formula}</div>` : '')
    + (m.note ? `<div class="dex-tooltip-note">${m.note}</div>` : '');
  tip.style.display = 'block';
  positionDexTooltip(e);
}
function positionDexTooltip(e){
  const tip = document.getElementById('dex-tooltip');
  if(!tip || tip.style.display!=='block') return;
  const gridEl = e.currentTarget && e.currentTarget.closest ? e.currentTarget.closest('.dex-grid') : null;

// ---------------- MINERAL SVG (procedural icon by category+rarity) ----------------
function mineralSVG(m, cx, cy){
  const color = RARITY_COLOR_HEX[m.rarity];
  const dark = shadeColor(color, -30);
  const r = 13;
  if(m.category==='工业矿物'){
    return polySVG(cx,cy,r,6,color,dark,0.15);
  } else if(m.category==='常见宝石矿物'){
    return diamondSVG(cx,cy,r,color,dark);
  } else if(m.category==='珍稀晶体矿物'){
    return starSVG(cx,cy,r,color,dark);
  } else {
    return blobSVG(cx,cy,r,color,dark);
  }
}
function shadeColor(hex, percent){
  hex = hex.replace('#','');
  let num = parseInt(hex,16);
  let r = (num>>16), g=(num>>8 & 0xff), b=(num & 0xff);
  r = Math.max(0,Math.min(255, r + percent));
  g = Math.max(0,Math.min(255, g + percent));
  b = Math.max(0,Math.min(255, b + percent));
  return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function polySVG(cx,cy,r,n,fill,edge,jag){
  let pts=[];
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2;
    const rr = r*(0.85+jag*Math.sin(i*2.3));
    pts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));
  }
  return `<polygon points="${pts.join(' ')}" fill="${fill}" stroke="${edge}" stroke-width="1.5"/>`;
}
function diamondSVG(cx,cy,r,fill,edge){
  return `<polygon points="${cx},${cy-r} ${cx+r*0.8},${cy} ${cx},${cy+r} ${cx-r*0.8},${cy}" fill="${fill}" stroke="${edge}" stroke-width="1.5"/>
  <polygon points="${cx},${cy-r*0.55} ${cx+r*0.3},${cy} ${cx},${cy} " fill="rgba(255,255,255,.55)"/>`;
}
function starSVG(cx,cy,r,fill,edge){
  let pts=[];
  const n=6;
  for(let i=0;i<n*2;i++){
    const a = (i/(n*2))*Math.PI*2;
    const rr = i%2===0? r : r*0.42;
    pts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));
  }
  return `<polygon points="${pts.join(' ')}" fill="${fill}" stroke="${edge}" stroke-width="1.2"/>`;
}
function blobSVG(cx,cy,r,fill,edge){
  return `<ellipse cx="${cx}" cy="${cy+2}" rx="${r*0.95}" ry="${r*0.72}" fill="${fill}" stroke="${edge}" stroke-width="1.5"/>
  <circle cx="${cx-r*0.3}" cy="${cy-r*0.2}" r="${r*0.18}" fill="${edge}"/>`;
}

// ==================================================================
// MINING ENGINE (multi-claw, pierce, reflect, timer, suit/faint)
// ==================================================================
const canvas = document.getElementById('mineCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const ANCHOR = {x: W/2, y: 78};
// The rope pivots from the miner's hand, a bit above ANCHOR. tipFor() and the
// rope-drawing code MUST use this exact same point, or the physics angle and
// the visually-drawn line angle disagree (worse at short lengths, converging
// as the rope extends — which looks like the angle "drifting" while firing).
const HOOK_PIVOT = {x: ANCHOR.x, y: ANCHOR.y-28};
const GROUND_Y = 140;
const SWING_LIMIT = Math.PI/2 - 0.10;
const MAX_LEN = 900;

function buildPool(terrain){
  const luckyMult = game.owned['luck'] ? 1.5 : 1.0;
  const extraDefs = terrain.minerals.map(n=>MIN_BY_NAME[n]);
  let raw = [];
  raw.push({name:terrain.baseOre, mineral:MIN_BY_NAME[terrain.baseOre], w: BASE_PROB, isBase:true});
  const commons = extraDefs.filter(m=>m.rarity==='普通');
  const specials = extraDefs.filter(m=>m.rarity!=='普通');
  let specialSum = 0;
  specials.forEach(m=>{
    let p = FIXED_PROB[m.rarity];
    if(m.rarity==='传说' || m.rarity==='史诗') p *= luckyMult;
    raw.push({name:m.name, mineral:m, w:p, isBase:false});
    specialSum += p;
  });
  const remaining = Math.max(0.0001, 1 - BASE_PROB - specialSum);
  const perCommon = commons.length ? remaining/commons.length : 0;
  commons.forEach(m=> raw.push({name:m.name, mineral:m, w:perCommon, isBase:false}));
  const total = raw.reduce((s,x)=>s+x.w,0);
  raw.forEach(x=>x.w = x.w/total);
  return raw;
}
function weightedPick(pool){
  let r = Math.random();
  for(const p of pool){ r -= p.w; if(r<=0) return p; }
  return pool[pool.length-1];
}
function rand(a,b){ return a+Math.random()*(b-a); }

const CLAW_OFFSETS = { 1:[0], 2:[-0.4,0.4], 3:[-0.55,0,0.55] };

function startMining(terrain){
  const pool = buildPool(terrain);
  const digCount = BASE_DIG_COUNT + game.detectorLevel;
  const spots = [];
  let tries=0;
  while(spots.length<digCount && tries<2000){
    tries++;
    const rr = rand(16,30);
    const x = rand(50,W-50);
    const y = rand(GROUND_Y+40,H-40);
    let ok=true;
    for(const s of spots){
      const dx=s.x-x, dy=s.y-y;
      if(Math.sqrt(dx*dx+dy*dy) < rr+s.r+16){ ok=false; break; }
    }
    if(ok) spots.push({x,y,r:rr});
  }
  const items = spots.map(s=>{
    const pick = weightedPick(pool);
    const m = pick.mineral;
    return {
      name:m.name, mineral:m, isBase:pick.isBase,
      x:s.x, y:s.y, r: pick.isBase?30:RARITY_R[m.rarity],
      weight: pick.isBase?2.8:RARITY_WEIGHT[m.rarity],
      alive:true, carried:false,
      hazardType: HAZARD.includes(m.name),
    };
  });

  const winchMult = game.owned['winch'] ? 1.25 : 1.0;
  const lightMult = game.owned['light'] ? 0.8 : 1.0;
  const timeTotal = BASE_DIG_TIME + game.timeLevel*5;

  const offsets = CLAW_OFFSETS[game.hookSlots];
  const hooks = [];
  for(let s=1; s<=game.hookSlots; s++){
    const up = game.hookUpgrades[s];
    hooks.push({
      slot:s, offset: offsets[s-1],
      angle:0, length:40, state:'swing',
      attachedGroup:[], bounced:false, clawOpen:1,
      pierce: !!up.pierce, reflect: !!up.reflect,
    });
  }

  mine = {
    terrain, items, digCount, remaining: digCount,
    hooks, baseSpeed: 480*winchMult, weightMult: lightMult,
    swingPhase: 0, swingSpeed: 1.25,
    timeLeft: timeTotal, timeTotal: timeTotal, ending:false,
    sessionValue: 0, caughtLog: {}, // name -> {mineral,count}
  };
  document.getElementById('mine-terrain-name').textContent = terrain.name;
  document.getElementById('mine-gold').textContent = 0;
  document.getElementById('mine-remain').textContent = mine.remaining+'/'+mine.digCount;
  document.getElementById('mine-result').classList.remove('show');
  document.getElementById('mine-faint').classList.remove('show');
  updateTimerUI();
  showScreen('mine');
}

function updateTimerUI(){
  if(!mine) return;
  const el = document.getElementById('mine-timer');
  const num = document.getElementById('mine-timer-num');
  const frac = Math.max(0, mine.timeLeft/mine.timeTotal);
  const deg = frac*360;
  el.style.background = `conic-gradient(var(--gold) ${deg}deg, rgba(255,255,255,0.14) ${deg}deg)`;
  const secs = Math.max(0, Math.ceil(mine.timeLeft));
  num.textContent = secs;
  el.classList.toggle('urgent', secs<=10);
}

function tipFor(hook){
  return { x: HOOK_PIVOT.x + Math.sin(hook.angle)*hook.length, y: HOOK_PIVOT.y + Math.cos(hook.angle)*hook.length };
}
function fireHook(){
  if(!mine) return;
  // Recompute the swing angle right now (rather than reusing last frame's
  // value) so the hook launches exactly where the player saw it, with no
  // extra lag from waiting on the next animation frame.
  const now = performance.now();
  const extraDt = lastTime ? Math.min(0.05, Math.max(0,(now-lastTime)/1000)) : 0;
  const liveMasterAngle = Math.sin(mine.swingPhase + mine.swingSpeed*extraDt) * SWING_LIMIT;
  for(const hook of mine.hooks){
    if(hook.state==='swing'){
      let a = liveMasterAngle + hook.offset;
      if(a>SWING_LIMIT) a=SWING_LIMIT; if(a<-SWING_LIMIT) a=-SWING_LIMIT;
      hook.angle = a;
      hook.state='extend'; hook.length=40; hook.attachedGroup=[]; hook.bounced=false;
    }
  }
}
window.addEventListener('keydown', e=>{
  if(e.code==='Space' && screens.mine.classList.contains('active')){ e.preventDefault(); fireHook(); }
});
canvas.addEventListener('click', fireHook);
document.getElementById('mine-leave-btn').addEventListener('click', ()=>{
  if(!mine || mine.ending) return;
  mine.ending = true;
  finishMining();
});
document.getElementById('mine-result-btn').addEventListener('click', ()=>{
  document.getElementById('mine-result').classList.remove('show');
  enterMain();
});
document.getElementById('mine-faint-btn').addEventListener('click', ()=>{
  document.getElementById('mine-faint').classList.remove('show');
  mine = null;
  enterMain();
  currentTab='shop';
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-shop').classList.add('active');
  renderTab('shop');
});

function grabItem(item){
  item.alive = false;
  item.carried = true;
  mine.remaining--;
  document.getElementById('mine-remain').textContent = mine.remaining+'/'+mine.digCount;
}

let popups = [];
let lastTime = 0;

function commitItem(item){
  if(item.hazardType){
    if(game.suitCharges>0){ game.suitCharges--; }
    else { return 'fainted'; }
  }
  game.discovered[item.name] = true;
  game.inventory[item.name] = (game.inventory[item.name]||0)+1;
  mine.sessionValue += item.mineral.price;
  if(!mine.caughtLog[item.name]) mine.caughtLog[item.name] = {mineral:item.mineral, count:0};
  mine.caughtLog[item.name].count++;
  playCatchSound(item);
  popups.push({x:ANCHOR.x,y:ANCHOR.y+10,life:1.2,
    text: '+'+item.mineral.price+'G',
    color: RARITY_COLOR_HEX[item.mineral.rarity]});
  return 'ok';
}

function updateMine(dt){
  if(mine.ending) return;
  mine.timeLeft -= dt;
  updateTimerUI();
  if(mine.timeLeft<=0){
    mine.timeLeft=0; mine.ending=true;
    setTimeout(()=>finishMining(), 120);
    return;
  }

  mine.swingPhase += mine.swingSpeed*dt;
  const masterAngle = Math.sin(mine.swingPhase) * SWING_LIMIT;

  let fainted = false;

  for(const hook of mine.hooks){
    if(fainted) break;
    const clawTarget = (hook.state==='retract' && hook.attachedGroup && hook.attachedGroup.length>0) ? 0 : 1;
    hook.clawOpen = (hook.clawOpen===undefined?1:hook.clawOpen) + (clawTarget-(hook.clawOpen===undefined?1:hook.clawOpen))*Math.min(1, dt*9);
    if(hook.state==='swing'){
      let a = masterAngle + hook.offset;
      if(a>SWING_LIMIT) a=SWING_LIMIT; if(a<-SWING_LIMIT) a=-SWING_LIMIT;
      hook.angle = a;
    } else if(hook.state==='extend'){
      hook.length += mine.baseSpeed*dt;
      const tip = tipFor(hook);
      const offscreen = tip.x<-20 || tip.x>W+20 || tip.y>H+20;
      if(!hook.pierce){
        let hit=null;
        for(const it of mine.items){
          if(!it.alive) continue;
          const dx=it.x-tip.x, dy=it.y-tip.y;
          if(Math.sqrt(dx*dx+dy*dy) < it.r+8){ hit=it; break; }
        }
        if(hit){ grabItem(hit); hook.attachedGroup=[hit]; hook.state='retract'; }
        else if(hook.length>MAX_LEN || offscreen){
          if(hook.reflect && !hook.bounced){
            hook.bounced=true; hook.length=40;
            hook.angle = rand(-SWING_LIMIT, SWING_LIMIT);
          } else { hook.state='retract'; }
        }
      } else {
        for(const it of mine.items){
          if(!it.alive) continue;
          const dx=it.x-tip.x, dy=it.y-tip.y;
          if(Math.sqrt(dx*dx+dy*dy) < it.r+8){ grabItem(it); hook.attachedGroup.push(it); }
        }
        if(hook.length>MAX_LEN || offscreen){
          if(hook.attachedGroup.length===0 && hook.reflect && !hook.bounced){
            hook.bounced=true; hook.length=40;
            hook.angle = rand(-SWING_LIMIT, SWING_LIMIT);
          } else { hook.state='retract'; }
        }
      }
    } else if(hook.state==='retract'){
      const group = hook.attachedGroup;
      let totalW = 0;
      group.forEach(it=> totalW += it.weight);
      const sp = totalW>0 ? mine.baseSpeed/(1+totalW*mine.weightMult*0.9) : mine.baseSpeed*1.6;
      hook.length -= sp*dt;
      const tip = tipFor(hook);
      group.forEach((it,i)=>{ it.x = tip.x + i*5; it.y = tip.y - i*5; });
      if(hook.length<=40){
        hook.length=40;
        for(const it of group){
          it.carried=false;
          if(fainted) continue;
          const res = commitItem(it);
          if(res==='fainted'){ fainted = true; }
        }
        document.getElementById('mine-gold').textContent = mine.sessionValue;
        hook.attachedGroup=[];
        hook.state='swing';
      }
    }
  }

  if(fainted){
    mine.ending = true;
    document.getElementById('mine-faint').classList.add('show');
    return;
  }

  if(mine.remaining<=0 && !mine.ending){
    mine.ending = true;
    setTimeout(()=>finishMining(), 260);
  }

  for(const p of popups){ p.y -= 28*dt; p.life -= dt; }
  popups = popups.filter(p=>p.life>0);
}

function finishMining(){
  if(!mine) return;
  const log = mine.caughtLog;
  const names = Object.keys(log);
  const totalCount = names.reduce((s,n)=>s+log[n].count,0);
  document.getElementById('mine-result-sub').textContent = totalCount + (lang==='zh' ? ' 件矿物' : ' items');
  const list = document.getElementById('mine-result-list');
  list.innerHTML = names.map(name=>{
    const e = log[name];
    return `<div class="result-chip">
      <span class="cnt">x${e.count}</span>
      ${mineralIconHTML(e.mineral,40,true)}
      <div class="n">${name}</div>
      <div class="v">${e.mineral.price}G ${lang==='zh'?'/个':'each'}</div>
    </div>`;
  }).join('') || `<div style="grid-column:1/-1;text-align:center;color:var(--cream-dim);padding:20px;">--</div>`;
  document.getElementById('mine-result').classList.add('show');
  mine = null;
}

function drawBackground(terrain){
  const bg = terrain ? ASSET['bg'+terrain.order] : null;
  if(bg && bg.loaded){
    ctx.drawImage(bg, 0, 0, W, H);
    return;
  }
  const sky = ctx.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0,'#bfe8ff'); sky.addColorStop(1,'#e8f7ff');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,GROUND_Y);
  const dirt = ctx.createLinearGradient(0,GROUND_Y,0,H);
  dirt.addColorStop(0,'#8a5a2e'); dirt.addColorStop(1,'#2a1808');
  ctx.fillStyle = dirt; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0,GROUND_Y,W,6);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for(let i=0;i<50;i++){
    const x=(i*53.7)%W, y=GROUND_Y+((i*97)%(H-GROUND_Y));
    ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
  }
}
function drawMiner(){
  const x=ANCHOR.x, y=ANCHOR.y-34;
  if(ASSET.miner && ASSET.miner.loaded){
    const iw = 120, ih = 156;
    ctx.drawImage(ASSET.miner, x-iw/2, y-ih+40, iw, ih);
    return;
  }
  ctx.fillStyle='#5a3a20'; ctx.fillRect(x-60,y+34,120,12);
  ctx.strokeStyle='#2c1a0c'; ctx.lineWidth=2; ctx.strokeRect(x-60,y+34,120,12);
  ctx.fillStyle='#3a6ea5'; ctx.fillRect(x-12,y,24,30);
  ctx.strokeStyle='#3a6ea5'; ctx.lineWidth=8; ctx.lineCap='round';
  const armSwing = mine.hooks[0] ? mine.hooks[0].angle : 0;
  ctx.beginPath();
  ctx.moveTo(x-12,y+6); ctx.lineTo(x-22-4*Math.sin(armSwing), y+16);
  ctx.moveTo(x+12,y+6); ctx.lineTo(x+22+4*Math.sin(armSwing), y+16);
  ctx.stroke();
  ctx.fillStyle='#f1c27d'; ctx.beginPath(); ctx.arc(x,y-8,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#d94f3d'; ctx.beginPath(); ctx.arc(x,y-12,12,Math.PI,0); ctx.fill();
  ctx.fillRect(x-14,y-12,28,4);
  ctx.fillStyle='#5a3a20'; ctx.fillRect(x-6,y-4,12,3);
}
function drawHook(hook){
  const tip = tipFor(hook);
  const start = HOOK_PIVOT;
  if(hook.pierce && hook.reflect){
    ctx.setLineDash([8,8]); ctx.lineWidth=2.5;
    ctx.lineDashOffset=0; ctx.strokeStyle=RARITY_COLOR_HEX['稀有'];
    ctx.beginPath(); ctx.moveTo(start.x,start.y); ctx.lineTo(tip.x,tip.y); ctx.stroke();
    ctx.lineDashOffset=8; ctx.strokeStyle='#4fbd6f';
    ctx.beginPath(); ctx.moveTo(start.x,start.y); ctx.lineTo(tip.x,tip.y); ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.strokeStyle = hook.pierce ? '#4a90e2' : (hook.reflect ? '#4fbd6f' : '#2a2a2a');
    ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(start.x,start.y); ctx.lineTo(tip.x,tip.y); ctx.stroke();
  }
  // When an item is being carried, don't draw the claw dead-center on the mineral —
  // pull it back toward the rope pivot so it sits on the near edge of the item's art,
  // and only render one prong. The missing prong reads as gripping the hidden backside.
  const carrying = hook.state==='retract' && hook.attachedGroup && hook.attachedGroup.length>0;
  let clawX = tip.x, clawY = tip.y, clawSide = 0;
  if(carrying){
    const heldItem = hook.attachedGroup[0];
    const r = (heldItem && heldItem.r) ? heldItem.r : 14;
    const pullback = r * 0.85;
    const dirX = Math.sin(hook.angle), dirY = Math.cos(hook.angle);
    clawX = tip.x - dirX*pullback;
    clawY = tip.y - dirY*pullback;
    clawSide = 1;
  }
  ctx.save(); ctx.translate(clawX,clawY); ctx.rotate(-hook.angle);
  if(ASSET.claw && ASSET.claw.loaded){
    const s = 30;
    if(clawSide!==0){
      ctx.save();
      ctx.beginPath();
      ctx.rect(clawSide>0 ? 0 : -s/2, -s/2, s/2, s);
      ctx.clip();
      ctx.drawImage(ASSET.claw, -s/2, -s/2, s, s);
      ctx.restore();
    } else {
      ctx.drawImage(ASSET.claw, -s/2, -s/2, s, s);
    }
  } else {
    const openT = hook.clawOpen===undefined ? 1 : hook.clawOpen;
    const OPEN_ANGLE = 0.62, CLOSE_ANGLE = 0.16; // radians from vertical, per prong
    const prongAngle = CLOSE_ANGLE + (OPEN_ANGLE-CLOSE_ANGLE)*openT;
    const prongLen = 15, tipLen = 5;
    ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=3.5; ctx.lineCap='round'; ctx.lineJoin='round';
    const sides = clawSide!==0 ? [clawSide] : [-1,1];
    sides.forEach(side=>{
      const dx = Math.sin(prongAngle)*side, dy = Math.cos(prongAngle);
      const kx = -dx, ky = dy; // slight inward hook at the prong's tip
      const ex = dx*prongLen, ey = dy*prongLen;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(ex,ey);
      ctx.lineTo(ex+kx*tipLen, ey+ky*tipLen*0.6);
      ctx.stroke();
    });
    ctx.fillStyle='#5a5a5a'; ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawItemCanvas(it){
  ctx.save(); ctx.translate(it.x,it.y);
  const color = it.isBase ? '#8a7a63' : RARITY_COLOR_HEX[it.mineral.rarity];
  const edge = shadeColor(color,-40);
  if(it.isBase){
    drawPoly(it.r,6,color,edge,0.15);
  } else if(it.mineral.category==='工业矿物'){
    drawPoly(it.r,6,color,edge,0.12);
  } else if(it.mineral.category==='常见宝石矿物'){
    drawDiamond(it.r,color,edge);
  } else if(it.mineral.category==='珍稀晶体矿物'){
    ctx.shadowColor=color; ctx.shadowBlur=12;
    drawStar(it.r,color,edge);
    ctx.shadowBlur=0;
  } else {
    drawBlob(it.r,color,edge);
  }
  if(it.hazardType){
    ctx.font='bold 14px sans-serif'; ctx.fillStyle='#ff8b7a'; ctx.textAlign='center';
    ctx.fillText('☠',0,-it.r-6);
  }
  ctx.restore();
}
function drawPoly(r,n,fill,edge,jag){
  ctx.fillStyle=fill; ctx.strokeStyle=edge; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2, rr=r*(0.85+jag*Math.sin(i*2.3));
    const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function drawDiamond(r,fill,edge){
  ctx.fillStyle=fill; ctx.strokeStyle=edge; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*0.8,0); ctx.lineTo(0,r); ctx.lineTo(-r*0.8,0); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.moveTo(0,-r*0.55); ctx.lineTo(r*0.3,0); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
}
function drawStar(r,fill,edge){
  ctx.fillStyle=fill; ctx.strokeStyle=edge; ctx.lineWidth=1.5;
  ctx.beginPath();
  const n=6;
  for(let i=0;i<n*2;i++){
    const a=(i/(n*2))*Math.PI*2, rr= i%2===0? r : r*0.42;
    const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function drawBlob(r,fill,edge){
  ctx.fillStyle=fill; ctx.strokeStyle=edge; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,2,r*0.95,r*0.72,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=edge; ctx.beginPath(); ctx.arc(-r*0.3,-r*0.15,r*0.16,0,Math.PI*2); ctx.fill();
}
function drawMine(){
  drawBackground(mine.terrain);
  for(const it of mine.items){ if(it.alive || it.carried) drawItemCanvas(it); }
  for(const hook of mine.hooks){ drawHook(hook); }
  drawMiner();
  ctx.textAlign='center'; ctx.font='bold 15px sans-serif';
  for(const p of popups){
    ctx.globalAlpha = Math.max(0,Math.min(1,p.life));
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }
}

function loop(ts){
  if(!lastTime) lastTime=ts;
  let dt=(ts-lastTime)/1000;
  if(dt>0.05) dt=0.05;
  lastTime=ts;
  if(mine && screens.mine.classList.contains('active')){
    updateMine(dt);
    drawMine();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
